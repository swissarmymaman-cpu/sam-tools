<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAM Lab: Brain</title>
<meta name="description" content="SAM Lab: is it where you start, or how you live? Real data from three open-access papers on moving, sitting, sleeping, women's reproductive history, training and the brain, turned into something you can play with.">
<link rel="canonical" href="https://tools.swissarmymum.com/lab-brain/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Swiss Army Mum">
<meta property="og:title" content="SAM Lab: Brain">
<meta property="og:description" content="Is it where you start, or how you live? Real data from three open-access papers, turned into something you can play with.">
<meta property="og:url" content="https://tools.swissarmymum.com/lab-brain/">
<meta property="og:image" content="https://app.swissarmymum.com/icons/logo-stamp.png">
<link rel="icon" type="image/png" href="https://app.swissarmymum.com/icons/logo-stamp.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#315E63;--green:#025A5A;--green-border:rgba(2,90,90,.28);
  --blue:#00579B;--blue-light:#E4EEF7;--blue-border:rgba(0,87,155,.32);
  /* amber = fills, dots and borders; amber-ink = the same hue darkened so amber text keeps at least 4.5:1 */
  --amber:#BA7517;--amber-ink:#8B5407;--amber-light:#FBEFD9;--amber-border:rgba(186,117,23,.5);
  --cream:#F7F4EF;--cream-dark:#EDE8E0;--ink:#1A1A18;--ink-mid:#4A4A45;--white:#fff;
  --r:14px;--r-lg:22px;--shadow:0 1px 2px rgba(40,30,20,.05),0 10px 30px rgba(40,30,20,.07);
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Montserrat',sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.6;overflow-x:hidden}
button{font-family:inherit}
a{color:var(--blue);text-underline-offset:2px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.app-header{background:var(--teal);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;min-height:52px}
.header-title{font-size:13px;font-weight:600;color:#fff;letter-spacing:.02em;line-height:1.2}
.header-tagline{font-size:9.5px;font-weight:300;color:rgba(255,255,255,.85);letter-spacing:.04em}
.header-logo img{width:34px;height:34px;object-fit:contain;display:block}
.header-logo svg{width:34px;height:34px;display:none}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
@media(max-width:480px){.wrap{padding:0 16px}}
/* hero: amber and blue at about 15% in the corners, cream in the middle */
.hero{background:linear-gradient(135deg,rgba(186,117,23,.15) 0%,rgba(247,244,239,0) 45%,rgba(247,244,239,0) 55%,rgba(0,87,155,.15) 100%),var(--cream);padding:28px 0 44px;border-bottom:1px solid var(--cream-dark)}
.badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:26px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.04em}
.badge-pillar{background:var(--green);color:#fff}
.badge-type{background:var(--white);color:var(--green);border:1px solid var(--green-border)}
.badge-lang{margin-left:auto;background:transparent;color:var(--green);border:1px solid var(--green);cursor:pointer;min-height:44px;min-width:48px;justify-content:center;border-radius:22px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:12px}
h1{font-size:clamp(2.1rem,6.5vw,3.6rem);font-weight:800;line-height:1.08;letter-spacing:-.02em;max-width:17ch}
h1 .s{color:var(--amber-ink)}
h1 .h{color:var(--blue)}
.hero .lead{font-size:clamp(1rem,2.3vw,1.15rem);color:var(--ink-mid);max-width:58ch;margin-top:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.stat{background:var(--white);border:1px solid var(--cream-dark);border-top:5px solid var(--blue);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stat.amb{border-top:5px dashed var(--amber)}
.stat .big{font-size:clamp(1.9rem,5.5vw,2.8rem);font-weight:800;line-height:1;color:var(--blue);letter-spacing:-.02em}
.stat.amb .big{color:var(--amber-ink)}
.stat .lbl{font-size:13px;font-weight:500;color:var(--ink-mid);margin-top:8px;line-height:1.45}
.guard{font-size:13.5px;font-weight:600;color:var(--ink-mid);margin-top:14px}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.cta{display:inline-flex;align-items:center;min-height:46px;padding:0 22px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none}
.cta.primary{background:var(--blue);color:#fff}
.cta.ghost{border:1.5px solid var(--blue);color:var(--blue);background:var(--white)}
/* papers strip */
.papers{margin-top:30px}
.papers-title{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.papers-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.paper{background:rgba(255,255,255,.8);border:1px solid var(--cream-dark);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--ink);display:block}
.paper:hover{background:#fff}
.paper .j{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.04em;text-transform:uppercase}
.paper.amb .j{color:var(--amber-ink)}
.paper .w{font-size:13px;font-weight:600;line-height:1.35;margin-top:3px}
.paper .n{font-size:12px;color:var(--ink-mid);margin-top:4px;line-height:1.4}
.paper .oa{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:700;color:var(--blue);background:var(--blue-light);border-radius:10px;padding:2px 8px}
.paper.amb .oa{color:var(--amber-ink);background:var(--amber-light)}
@media(max-width:700px){.stats,.papers-grid{grid-template-columns:1fr}.stats{gap:10px}}
/* steps */
section.step{padding:56px 0 6px}
.stepno{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;margin-bottom:12px}
.stepno.a{background:var(--amber);color:var(--ink)}
.stepno.you{width:auto;min-width:38px;padding:0 16px;border-radius:999px;letter-spacing:.04em}
h2{font-size:clamp(1.45rem,4vw,2.05rem);font-weight:800;line-height:1.15;letter-spacing:-.01em;margin-bottom:10px}
.lead{font-size:15.5px;color:var(--ink-mid);max-width:62ch}
.lead+.lead{margin-top:8px}
.panel{background:var(--white);border:1px solid var(--cream-dark);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px;margin-top:20px}
.panel+.lead{margin-top:18px}
@media(max-width:600px){.panel{padding:16px}}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.controls+.controls{margin-top:-2px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--blue-border);background:var(--white);color:var(--blue);font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.amb{border-color:var(--amber-border);color:var(--amber-ink)}
.chip.amb[aria-pressed="true"]{background:var(--amber-ink);border-color:var(--amber-ink);color:#fff}
.chip.view{border-style:dashed}
.chip.view[aria-pressed="true"]{border-style:solid}
.cmp{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px}
/* forest: one row per published result, real text beside a drawn track */
.forest{position:relative}
.frows{position:relative;display:flex;flex-direction:column;gap:3px}
.refline{position:absolute;top:0;bottom:0;width:2px;background:#4A4A45;pointer-events:none;z-index:1}
.frow{--rowbg:var(--white);width:100%;text-align:left;background:transparent;border:1.5px solid transparent;border-radius:12px;padding:5px 8px;color:var(--ink);font-size:13px;min-height:44px}
button.frow{cursor:pointer}
button.frow:hover{border-color:var(--amber-border)}
.frow.on{border-color:var(--blue)}
.frow.amb.on{border-color:var(--amber-ink)}
.frow .fl,.frow .fv,.frow .ft{position:relative;z-index:2}
.frow .fl b,.frow .fl span,.frow .fv>span{display:table;background:var(--rowbg);padding-right:4px}
.frow .fv>span{margin-left:auto;padding:0 0 0 4px}
.frow,.faxis{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr) 124px;gap:2px 12px;align-items:center}
.faxis{padding:0 9.5px}
.fl b{font-size:13px;font-weight:700;line-height:1.3}
.fl span{font-size:11.5px;color:var(--ink-mid);line-height:1.35}
.fv{font-size:13px;font-weight:800;color:var(--blue);text-align:right;line-height:1.3}
.frow.amb .fv{color:var(--amber-ink)}
.frow .fv.plain{color:var(--ink-mid);font-weight:600}
.ft{display:block;width:100%;height:auto;overflow:visible}
.forest svg text{font-family:'Montserrat',sans-serif}
@media(max-width:599px){
  .frow,.faxis{grid-template-columns:minmax(0,1fr) auto}
  .frow .fl{grid-row:1;grid-column:1}
  .frow .fv{grid-row:1;grid-column:2;max-width:172px}
  .frow .ft{grid-row:2;grid-column:1/-1}
  .faxis .fl,.faxis .fv{display:none}
  .faxis .ft{grid-row:1;grid-column:1/-1}
}
.result{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;background:var(--blue-light);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.result.amb{background:var(--amber-light)}
.result .big{font-size:2rem;font-weight:800;line-height:1;color:var(--blue)}
.result .big.word{font-size:1.25rem;line-height:1.2}
.result.amb .big{color:var(--amber-ink)}
.result .txt{font-size:14.5px;font-weight:600;line-height:1.45;flex:1;min-width:200px}
.result .txt b{font-weight:700}
.result .txt small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-mid);margin-top:3px}
.callout{font-size:14.5px;line-height:1.6;margin-top:14px;padding-left:14px;border-left:4px solid var(--blue)}
.callout.amb{border-color:var(--amber)}
.callout:empty{display:none}
.src{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:11.5px;font-weight:600;color:var(--ink-mid);background:var(--cream);border:1px solid var(--cream-dark);border-radius:999px;padding:4px 12px}
.src::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.src.amb::before{background:var(--amber)}
/* step 3 tiles */
.tiles{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{display:flex;flex-direction:column;border-radius:var(--r);padding:14px 12px;border:2px solid var(--blue);min-height:148px;background:var(--white);transition:background .25s,color .25s}
.tile b{font-size:14.5px;font-weight:800;line-height:1.25}
.tile .ex{font-size:12px;line-height:1.4;margin-top:4px;color:var(--ink-mid)}
.tile .state{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;font-weight:700;line-height:1.3;margin-top:auto;padding-top:10px}
.tile .state svg{flex:none;width:15px;height:15px;margin-top:1px}
.tile.gain{background:var(--blue);color:#fff}
.tile.gain .ex{color:#fff}
.tile.same b,.tile.same .state{color:var(--blue)}
.tile.none{border:2px dashed #6A6A63}
.tile.none b,.tile.none .state{color:var(--ink-mid)}
.punch{font-size:clamp(1.15rem,3vw,1.4rem);font-weight:800;line-height:1.35;margin-top:22px;color:var(--blue)}
.punch .s{color:var(--amber-ink)}
.back a{font-size:14px;font-weight:700;min-height:44px;display:inline-flex;align-items:center}
/* your week */
.q{font-size:15px;font-weight:700;margin-bottom:8px;line-height:1.4}
.q small{font-size:13px;font-weight:500;color:var(--ink-mid)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.opts.two{grid-template-columns:repeat(2,1fr)}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
.opt{min-height:46px;border:1.5px solid var(--blue-border);background:var(--white);color:var(--blue);border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;padding:6px 12px;line-height:1.3}
.opt[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.mine{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
@media(max-width:760px){.mine{grid-template-columns:1fr}}
.mine .result{margin-top:0;display:block}
.mine .eb{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.mine .main{font-size:16px;font-weight:700;line-height:1.35}
.mine .main.wait{font-size:14px;font-weight:500;color:var(--ink-mid)}
.mine .sub{font-size:13px;color:var(--ink-mid);margin-top:6px;line-height:1.45}
.note{font-size:13px;font-weight:600;color:var(--ink);margin-top:12px}
.next{border:2px solid var(--blue);border-radius:var(--r-lg);padding:18px 20px;margin-top:18px;background:var(--white)}
.next .eb{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.next h3{font-size:18px;font-weight:800;line-height:1.35;margin:4px 0 6px}
.next p{font-size:14px;color:var(--ink-mid)}
.next p:empty{display:none}
.next p a{font-weight:700;min-height:44px;display:inline-flex;align-items:center}
.seedata{margin:10px 0 0;font-weight:700;font-size:14.5px}.seedata a{color:inherit;min-height:44px;display:inline-flex;align-items:center}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px}
.links a{font-size:14px;font-weight:700;min-height:44px;display:inline-flex;align-items:center}
.bridge{margin-top:64px;padding-top:36px;border-top:1px solid var(--cream-dark)}
.bridge h2{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:800;letter-spacing:-.01em;line-height:1.15}
.bridge p{color:var(--ink-mid);margin-top:8px}
.sub-card{background:var(--white);border:1px solid var(--cream-dark);border-radius:var(--r-lg);padding:22px;margin-top:40px;box-shadow:var(--shadow)}
.sub-title{font-size:18px;font-weight:800;line-height:1.35;margin-bottom:6px}
.sub-text{font-size:14px;color:var(--ink-mid);margin-bottom:16px;max-width:60ch}
.sub-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;background:var(--teal);color:#fff;text-decoration:none;border-radius:var(--r);font-size:15px;font-weight:700}
details.more{margin-top:22px;background:var(--white);border:1px solid var(--cream-dark);border-radius:var(--r)}
details.more summary{cursor:pointer;list-style:none;min-height:52px;display:flex;align-items:center;gap:8px;padding:0 18px;font-size:14.5px;font-weight:700;color:var(--blue)}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:'\25B8';transition:transform .15s}
details.more[open]>summary::before,details.nums[open]>summary::before{transform:rotate(90deg)}
details.nums{margin:8px 0;border:1px solid var(--cream-dark);border-radius:var(--r)}
details.more details.nums>summary{font-size:13.5px;padding:0 12px;min-height:46px}
.nums>div{padding:0 12px 8px}
.more-body{padding:0 18px 18px}
.more-body h3{font-size:13.5px;font-weight:800;margin:16px 0 4px}
.more-body p{font-size:13px;color:var(--ink-mid);margin-bottom:8px;max-width:72ch}
.more-body p b{color:var(--ink)}
.tblwrap{overflow-x:auto;max-width:100%;margin:4px 0 8px}
table{border-collapse:collapse;font-size:12px;width:100%;min-width:640px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--cream-dark);vertical-align:top}
th{color:var(--ink-mid);font-weight:600}
td.pp{font-weight:700;white-space:nowrap}
td.nw{white-space:nowrap}
footer{text-align:center;margin-top:28px;padding:20px 0 40px;border-top:1px solid var(--cream-dark)}
footer a{font-size:13px;font-weight:600;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app-header">
  <div><div class="header-title">Swiss Army Mum</div><div class="header-tagline">Not every tool. Just the right ones.</div></div>
  <div class="header-logo"><img src="https://app.swissarmymum.com/icons/logo-stamp.png" alt="SAM logo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="#fff" stroke-width="2"/><text x="17" y="21.5" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="11" font-weight="800" fill="#fff">SAM</text></svg></div>
</div>

<header class="hero">
  <div class="wrap">
    <div class="badges">
      <span class="badge badge-pillar"><span data-t="pillar"></span> · <span data-t="area"></span></span>
      <span class="badge badge-type">SAM Lab</span>
      <button class="badge badge-lang" id="lang" type="button"></button>
    </div>
    <div class="eyebrow" data-t="eyebrow"></div>
    <h1 data-t="h1"></h1>
    <p class="lead" data-t="heroLead"></p>
    <div class="stats">
      <div class="stat"><div class="big" id="st1"></div><div class="lbl" data-t="st1"></div></div>
      <div class="stat"><div class="big" id="st2"></div><div class="lbl" data-t="st2"></div></div>
      <div class="stat amb"><div class="big" id="st3"></div><div class="lbl" data-t="st3"></div></div>
    </div>
    <p class="guard" data-t="guard"></p>
    <div class="ctas"><a class="cta primary" href="#s4" data-t="ctaMine"></a><a class="cta ghost" href="#s1" data-t="ctaWalk"></a></div>
    <div class="papers">
      <div class="papers-title" data-t="papersTitle"></div>
      <div class="papers-grid" id="papers"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="step" id="s4">
    <div class="stepno you" data-t="youTag"></div>
    <h2 data-t="s4H"></h2>
    <p class="lead" data-t="s4Lead"></p>
    <div class="panel">
      <p class="q" id="q1" data-t="q1"></p>
      <div class="opts" id="o1" role="group" aria-labelledby="q1"></div>
      <p class="q" id="q2" data-t="q2"></p>
      <div class="opts two" id="o2" role="group" aria-labelledby="q2"></div>
      <p class="q" id="q3" data-t="q3"></p>
      <div class="opts" id="o3" role="group" aria-labelledby="q3"></div>
      <div class="mine" aria-live="polite">
        <div class="result"><div class="eb" data-t="eb1"></div><div class="main" id="m1"></div><div class="sub" id="m1s"></div></div>
        <div class="result"><div class="eb" data-t="eb2"></div><div class="main" id="m2"></div><div class="sub" id="m2s"></div></div>
        <div class="result"><div class="eb" data-t="eb3"></div><div class="main" id="m3"></div><div class="sub" id="m3s"></div></div>
      </div>
      <p class="note" data-t="mineNote"></p>
      <div class="next" aria-live="polite"><div class="eb" data-t="nextEb"></div><h3 id="nextH"></h3><p id="nextP"></p></div>
      <p class="seedata"><a href="#s1" data-t="seeData"></a></p>
      <div class="links">
        <a href="https://www.swissarmymum.com/p/perimenopause-brain-fog" target="_blank" rel="noopener" data-t="lnk1"></a>
        <a href="https://www.swissarmymum.com/p/lifestyle-levers-for-your-brain-what" target="_blank" rel="noopener" data-t="lnk2"></a>
      </div>
    </div>
  </section>

  <div class="bridge"><h2 data-t="dataH"></h2><p data-t="dataP"></p></div>

  <section class="step" id="s1">
    <div class="stepno">1</div>
    <h2 data-t="s1H"></h2>
    <p class="lead" data-t="s1Lead"></p>
    <div class="panel">
      <div class="controls" id="g1" role="group"></div>
      <div class="controls" id="a1" role="group"></div>
      <div class="forest" id="c1" role="group"></div>
      <div class="result" aria-live="polite"><div class="big" id="r1big"></div><div class="txt" id="r1txt"></div></div>
      <p class="callout" id="c1note"></p>
      <span class="src" data-t="src1"></span>
    </div>
    <p class="lead" data-t="sexNote"></p>
  </section>

  <section class="step" id="s2">
    <div class="stepno a">2</div>

  subText:"Every week, Swiss Army Mum turns the research on sleep, food, movement, the brain and the mind into one thing you can actually do. For busy women 35+.",

  moreSum:"How sure are we? Sources and details",
  more:()=>{
    const pl=ph(D.a_pa_65_fu_long.e),s1=ph(D.a_sleep_short_fu_short.e),s2=ph(D.a_sleep_short_65_fu_long.e),pu=ph(D.p1_pill_ever_unadj.e),pa=ph(D.p1_pill_ever.e),py=ph(D.p1_pill_age_lt65.e),po=ph(D.p1_pill_age_ge65.e),hh=ph(D.p1_hysterectomy_ses_higher.e),hl=ph(D.p1_hysterectomy_ses_lower.e),hr=ph(D.p1_hrt_ever.e),ol=ph(D.p1_oophorectomy_ses_lower.e),x=D.p1_hysterectomy_after_oophorectomy.e,pr=ints(D.p2_protocol_res),ds=ints(D.p2_dose_mb_42);
    const R=r=>r.dir==="same"?`from ${pc(r.a)} lower to ${pc(r.b)} higher`:`${r.a} to ${pc(r.b)} ${r.dir==="up"?"higher":"lower"}`;
    return `<h3>How sure are we?</h3>
<p><b>Links, not proof, in two of the three.</b> Oye-Somefun and Gong rest on studies that followed people for years. They show which groups did better, not that changing a habit changes what happens to you. Han combines trials, so there training did change test scores. That is not the same as preventing dementia.</p>
<p><b>Relative, not personal.</b> A percentage higher or lower compares groups of people. The one absolute figure here comes from Gong: ${num(before(D.p1_n_dementia_women))} of ${num(D.p1_n_women)} women (${pc(ABSP)}) were diagnosed with dementia over a typical (median) ${D.p1_followup_median} years. They were ${before(D.p1_age_mean)} years old on average when they joined.</p>
<p><b>Counts per analysis (Oye-Somefun).</b> Activity: ${D.a_n_pa_studies} studies, ${num(D.a_n_pa_people)} people, mean age ${nm(D.a_pa_mean_age)}. Sleep: ${D.a_n_sleep_studies} studies, ${num(D.a_n_sleep_people)} people, mean age ${nm(D.a_sleep_mean_age)}; the same studies give both the short and the long sleep result. Sitting: ${D.a_n_sit_studies} studies, ${num(D.a_n_sit_people)} people, mean age ${nm(D.a_sit_mean_age)}. Some studies sit in two sets, so these are never added.</p>
<p><b>What “regularly active” means.</b> ${MIN} minutes or more a week of aerobic activity against inactive people, or approximations of that: where a study used another cut-off, its most and least active groups. The paper doesn't say how many of the ${D.a_n_pa_studies} studies used ${MIN} minutes. The activity studies also differ from one another far more than chance would explain, so the combined number averages quite different results. The age and follow-up rows come without a test comparing them.</p>
<p><b>Where the range includes no difference.</b> Activity in people ${D.a_pa_65_fu_long.cut} and over followed ${D.a_pa_65_fu_long.fu} years or more: ${pc(pl.p)} lower (plausible range ${R(pl)}; ${D.a_pa_65_fu_long.n} studies). Short sleep in studies lasting under ${D.a_sleep_short_fu_short.fu} years: ${pc(s1.p)} higher (${R(s1)}; ${D.a_sleep_short_fu_short.n} studies). Short sleep in people ${D.a_sleep_short_65_fu_long.cut} and over followed ${D.a_sleep_short_65_fu_long.fu} years or more: ${pc(s2.p)} higher (${R(s2)}; ${D.a_sleep_short_65_fu_long.n} studies).</p>
<p><b>Cause, or early sign?</b> Dementia builds up silently for years and can itself make people move less or sleep differently. The authors call this unlikely because nobody had a diagnosis at the start, but also say the long silent phase “could contribute” to it (p. 14), and that short follow-ups can't rule it out. For long sleep, they mention other illnesses, inflammation or early brain changes.</p>
<p><b>How the studies were rated.</b> At serious risk of bias: ${robN(D.a_rob_pa_serious)} of ${D.a_n_pa_studies} activity studies, ${robN(D.a_rob_sleep_serious)} of ${D.a_n_sleep_studies} sleep studies and ${robN(D.a_rob_sit_serious)} of ${D.a_n_sit_studies} sitting studies. Habits were self-reported and sleep quality wasn't counted. The sitting studies followed people for ${nm(D.a_sit_mean_fu)} years on average. Neither review (Oye-Somefun, Han) grades how certain its evidence is (GRADE).</p>
<p><b>Women and men.</b> In the review's words (p. 14), “very few studies reported results stratified by sex”. Some cohorts included only women or only men. No combined number for women is printed.</p>
<p><b>Who Gong studied.</b> Volunteers from UK Biobank: ${pc(inPar(D.p1_white_n))} white, healthier and better off than average. Reproductive history was self-reported. Dementia came from hospital and death records, so some cases may be missed. Other studies they cite vary: some match, two found the opposite for later menopause, one found no link with reproductive span. Other factors in the paper are not shown here.</p>
<p><b>“Floating” ranges.</b> For first period and menopause, every group has its own range, the comparison group included, and those ranges are narrower than a direct comparison would give. So on this page a dot is filled or hollow according to the paper's own test, not according to whether its range touches the line. The menopause rows count only women with a natural menopause.</p>
<p><b>Oestrogen.</b> It wasn't measured. The early first-period result doesn't fit the idea, because an early start usually means longer exposure. Hormone therapy showed no association (${pc(hr.p)} lower; plausible range ${R(hr)}).</p>
<p><b>The pill.</b> Before allowing for age and other differences, pill users had ${pc(pu.p)} lower risk; after, ${pc(pa.p)}. So most of the raw gap was about who takes the pill, and some of what is left may be too. It was only clear in women under ${C("p1_pill_age_lt65")} at the start (${pc(py.p)} lower; ${R(py)}), not at ${C("p1_pill_age_ge65")} and over (${pc(po.p)} lower; ${R(po)}). The authors ask for trials.</p>
<p><b>Surgery.</b> Three comparisons that must not be mixed. Any womb removal against women who never had one: borderline, and not the same everywhere: no clear difference in women from better-off areas (${R(hh)}), ${pc(hl.p)} higher in women from poorer areas (${R(hl)}). Any ovary removal: no clear difference overall, but ${pc(ol.p)} higher (${ol.a} to ${pc(ol.b)}) in poorer areas. Womb removed after the ovaries had already been removed, against women who had had neither: ${x[0]} times the risk, with a plausible range from ${x[1]} to ${x[2]} times; the number of women isn't in the article. On womb removal with the ovaries kept, the paper contradicts itself and prints no number.</p>
<p><b>Han: we followed the tables.</b> The abstract names strength for overall thinking and aerobic for memory; its own tables show a larger effect for mind-body in both, so we show no winner. “${pr[0]} times a week, ${pr[1]} minutes, ${pr[2]} weeks” is a label for strength with no analysis behind it; its subgroup results lean towards ${ds[0]} or more sessions a week, ${ds[1]} to ${ds[2]} minutes, ${ds[3]} to ${ds[4]} weeks.</p>
<p><b>Han: quality flags.</b> The ${D.p2_n_rcts} include intervals and working memory, not shown; the paper doesn't print how many trials sit behind each result. In its reference list, some included trials lead to unrelated papers, and one title concerns probable mild cognitive impairment, though the paper says healthy. The age rule differs inside the paper (${ints(D.p2_age_incl_abs)[0]} and over in the abstract, average of ${ints(D.p2_age_incl_meth)[0]} and over in the methods), and so does the number of participants (${num(D.p2_n_participants_abs)} or ${num(D.p2_n_participants_intro)}). Promised consistency checks aren't reported, and there are no results by sex. We left out working memory, because its main result is implausibly large and unexplained, and high-intensity intervals, because their rows don't match between tables and were never clearly different from the comparison group.</p>
<p><b>Do the three agree?</b> They answer different questions, so they neither agree nor disagree.</p>

  subText:"Cada semana, Swiss Army Mum convierte la investigación sobre sueño, alimentación, movimiento, cerebro y mente en una sola cosa que puedes hacer de verdad. Para mujeres ocupadas de más de 35 años. En inglés.",

  more:()=>{
    const pl=ph(D.a_pa_65_fu_long.e),s1=ph(D.a_sleep_short_fu_short.e),s2=ph(D.a_sleep_short_65_fu_long.e),pu=ph(D.p1_pill_ever_unadj.e),pa=ph(D.p1_pill_ever.e),py=ph(D.p1_pill_age_lt65.e),po=ph(D.p1_pill_age_ge65.e),hh=ph(D.p1_hysterectomy_ses_higher.e),hl=ph(D.p1_hysterectomy_ses_lower.e),hr=ph(D.p1_hrt_ever.e),ol=ph(D.p1_oophorectomy_ses_lower.e),x=D.p1_hysterectomy_after_oophorectomy.e,pr=ints(D.p2_protocol_res),ds=ints(D.p2_dose_mb_42);
    const R=r=>r.dir==="same"?`de un ${pc(r.a)} menos a un ${pc(r.b)} más`:`entre un ${r.a} y un ${pc(r.b)} ${r.dir==="up"?"más":"menos"}`;
    return `<h3>¿Cuánta certeza hay?</h3>
<p><b>Relaciones, no pruebas, en dos de los tres.</b> Oye-Somefun y Gong se apoyan en estudios que siguieron a personas durante años. Muestran qué grupos salieron mejor, no que cambiar un hábito cambie lo que te pase. Han reúne ensayos, así que ahí el entrenamiento sí cambió las puntuaciones de las pruebas. Eso no es lo mismo que prevenir la demencia.</p>
<p><b>Relativo, no personal.</b> Un porcentaje de más o de menos compara grupos de personas. La única cifra absoluta viene de Gong: a ${num(before(D.p1_n_dementia_women))} de ${num(D.p1_n_women)} mujeres (${pc(dec(ABSP))}) se les diagnosticó demencia con un seguimiento típico (mediana) de ${dec(D.p1_followup_median)} años. Tenían de media ${dec(before(D.p1_age_mean))} años al entrar.</p>
<p><b>Recuentos por análisis (Oye-Somefun).</b> Actividad: ${D.a_n_pa_studies} estudios, ${num(D.a_n_pa_people)} personas, edad media de ${dec(nm(D.a_pa_mean_age))} años. Sueño: ${D.a_n_sleep_studies} estudios, ${num(D.a_n_sleep_people)} personas, edad media de ${dec(nm(D.a_sleep_mean_age))}; los mismos estudios dan el resultado de dormir poco y el de dormir mucho. Tiempo sentado: ${D.a_n_sit_studies} estudios, ${num(D.a_n_sit_people)} personas, edad media de ${dec(nm(D.a_sit_mean_age))}. Algunos estudios están en dos conjuntos, así que nunca se suman.</p>
<p><b>Qué significa «activas con regularidad».</b> ${MIN} minutos o más a la semana de actividad aeróbica frente a personas inactivas, o aproximaciones a eso: si un estudio usaba otro corte, su grupo más activo frente al menos activo. El artículo no dice cuántos de los ${D.a_n_pa_studies} estudios usaron ${MIN} minutos. Además, los estudios de actividad difieren entre sí mucho más de lo que explicaría el azar, así que la cifra combinada promedia resultados bastante distintos. Las filas por edad y por años de seguimiento vienen sin una prueba que las compare.</p>
<p><b>Dónde el margen incluye la ausencia de diferencia.</b> Actividad en personas de ${D.a_pa_65_fu_long.cut} años o más seguidas ${D.a_pa_65_fu_long.fu} años o más: un ${pc(pl.p)} menos (margen probable: ${R(pl)}; ${D.a_pa_65_fu_long.n} estudios). Dormir poco, en estudios de menos de ${D.a_sleep_short_fu_short.fu} años: un ${pc(s1.p)} más (${R(s1)}; ${D.a_sleep_short_fu_short.n} estudios). Dormir poco, en personas de ${D.a_sleep_short_65_fu_long.cut} años o más seguidas ${D.a_sleep_short_65_fu_long.fu} años o más: un ${pc(s2.p)} más (${R(s2)}; ${D.a_sleep_short_65_fu_long.n} estudios).</p>
<p><b>¿Causa o señal temprana?</b> La demencia avanza en silencio durante años y puede hacer por sí misma que alguien se mueva menos o duerma distinto. Los autores lo ven poco probable porque nadie tenía un diagnóstico al empezar, pero también dicen que esa larga fase silenciosa «podría contribuir» a ello (p. 14, traducido) y que los seguimientos cortos no permiten descartarlo. Para dormir mucho, mencionan otras enfermedades, inflamación o cambios tempranos en el cerebro.</p>
<p><b>Cómo se valoraron los estudios.</b> Con riesgo serio de sesgo: ${robN(D.a_rob_pa_serious)} de ${D.a_n_pa_studies} estudios de actividad, ${robN(D.a_rob_sleep_serious)} de ${D.a_n_sleep_studies} de sueño y ${robN(D.a_rob_sit_serious)} de ${D.a_n_sit_studies} de tiempo sentado. Los hábitos eran autodeclarados y no se tuvo en cuenta la calidad del sueño. Los estudios de tiempo sentado siguieron a las personas una media de ${dec(nm(D.a_sit_mean_fu))} años. Ninguna de las dos revisiones (Oye-Somefun y Han) gradúa la certeza de sus resultados (GRADE).</p>
<p><b>Mujeres y hombres.</b> En palabras de la revisión (p. 14, traducidas), «muy pocos estudios dieron resultados estratificados por sexo». Algunas cohortes incluían solo mujeres o solo hombres. No se publica ninguna cifra combinada para las mujeres.</p>
<p><b>A quién estudió Gong.</b> Voluntarias del UK Biobank: un ${pc(dec(inPar(D.p1_white_n)))} blancas, más sanas y con mejor situación económica que la media. La historia reproductiva era autodeclarada. Los casos de demencia salen de registros hospitalarios y de defunción, así que pueden faltar algunos. Los otros estudios que citan discrepan: algunos coinciden, dos hallaron lo contrario para la menopausia tardía y uno no vio relación con los años reproductivos. Otros factores del artículo no se muestran aquí.</p>
<p><b>Márgenes «flotantes».</b> Para la primera regla y la menopausia, cada grupo tiene su propio margen, también el de comparación, y esos márgenes son más estrechos de lo que daría una comparación directa. Por eso aquí un punto va relleno o hueco según la prueba del propio artículo, no según si su margen toca la línea. Las filas de menopausia cuentan solo a mujeres con menopausia natural.</p>
<p><b>Estrógenos.</b> No se midieron. El resultado de la primera regla temprana no encaja con la idea, porque empezar antes suele significar más exposición. La terapia hormonal no mostró relación (un ${pc(hr.p)} menos; margen probable: ${R(hr)}).</p>
<p><b>La píldora.</b> Antes de tener en cuenta la edad y otras diferencias, quienes la tomaron tenían un ${pc(pu.p)} menos de riesgo; después, un ${pc(pa.p)}. Así que la mayor parte de la distancia inicial dependía de quién toma la píldora, y parte de lo que queda también puede depender de eso. Solo era clara en mujeres de menos de ${C("p1_pill_age_lt65")} años al empezar (un ${pc(py.p)} menos; ${R(py)}), no a partir de los ${C("p1_pill_age_ge65")} (un ${pc(po.p)} menos; ${R(po)}). Los autores piden ensayos.</p>
<p><b>Cirugía.</b> Tres comparaciones que no se deben mezclar. Cualquier extirpación del útero frente a ninguna: en el límite, y distinta según la zona: sin diferencia clara en las mujeres de zonas más acomodadas (${R(hh)}) y un ${pc(hl.p)} más en las de zonas más pobres (${R(hl)}). Extirpación de ovarios: sin diferencia clara en conjunto, pero un ${pc(ol.p)} más (entre un ${ol.a} y un ${pc(ol.b)}) en las zonas más pobres. Útero extirpado después de haber extirpado los ovarios, frente a mujeres sin ninguna de las dos operaciones: ${dec(x[0])} veces el riesgo, con un margen probable de ${dec(x[1])} a ${dec(x[2])} veces; el número de mujeres no está en el artículo. Sobre el útero extirpado conservando los ovarios, el artículo se contradice y no publica ninguna cifra.</p>
<p><b>Han: hemos seguido las tablas.</b> El resumen nombra la fuerza para la capacidad mental general y el aeróbico para la memoria; sus propias tablas muestran un efecto mayor del cuerpo y mente en las dos, así que no señalamos ganador. «${pr[0]} veces por semana, ${pr[1]} minutos, ${pr[2]} semanas» es una etiqueta para la fuerza sin ningún análisis detrás; sus resultados por subgrupos se inclinan por ${ds[0]} o más sesiones por semana, de ${ds[1]} a ${ds[2]} minutos, durante ${ds[3]} a ${ds[4]} semanas.</p>
<p><b>Han: señales de alerta sobre su calidad.</b> Los ${D.p2_n_rcts} incluyen los intervalos y la memoria de trabajo, que no mostramos; el artículo no publica cuántos hay detrás de cada resultado. En su lista de referencias, algunos ensayos incluidos llevan a artículos que no tienen nada que ver, y un título trata de un probable deterioro cognitivo leve, aunque el artículo dice que eran personas sanas. El criterio de edad cambia dentro del artículo (${ints(D.p2_age_incl_abs)[0]} años o más en el resumen, media de ${ints(D.p2_age_incl_meth)[0]} o más en los métodos), y también el número de participantes (${num(D.p2_n_participants_abs)} o ${num(D.p2_n_participants_intro)}). No se publican las comprobaciones de consistencia prometidas ni hay resultados por sexo. Hemos dejado fuera la memoria de trabajo, porque su resultado principal es inverosímilmente grande y no se explica, y los intervalos de alta intensidad, porque sus filas no coinciden entre tablas y nunca se diferenciaron claramente del grupo de comparación.</p>
<p><b>¿Coinciden los tres?</b> Responden a preguntas distintas, así que ni coinciden ni se contradicen.</p>
${numbersTable()}

  if(b.id==="lang"){lang=lang==="en"?"es":"en";render();return}
  if(d.q1){st.q1=d.q1;press("#o1 .opt",b);mine()}
  if(d.q2){st.q2=d.q2;press("#o2 .opt",b);mine()}
  if(d.q3){st.q3=d.q3;press("#o3 .opt",b);mine()}
  if(d.h){st.h=d.h;press("#g1 .chip",b);step1()}
  if(d.age){st.age=d.age;press("#a1 .chip",b);step1()}
  if(d.g){st.g=d.g;press("#g2 .chip",b);step2()}
  if(d.row!==undefined){st.row[st.g]=+d.row;step2();const n=$("c2").querySelector(`[data-row="${d.row}"]`);if(n)n.focus()}
  if(d.v){st.v=d.v;press("#v3 .chip",b);step3ctl();chart3()}
  if(d.tr){st.tr=d.tr;press("#g3 .chip",b);chart3()}
  if(d.sk){st.sk=d.sk;press("#g3 .chip",b);chart3()}
});
/* the tracks are drawn at real pixel width, so redraw on any resize, and once the font has loaded */
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{chart1();chart2()},120)});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{chart1();chart2()});
render();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAM Lab: Exercise</title>
<meta name="description" content="SAM Lab: how much moving, how much lifting? Real data from three open-access papers on movement, strength training and bone after menopause, turned into something you can play with.">
<link rel="icon" type="image/png" href="https://app.swissarmymum.com/icons/logo-stamp.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#315E63;--green:#025A5A;--green-mid:#3D7A78;--green-light:#E0F2F1;--green-soft:#B9D9D3;--green-border:rgba(2,90,90,.28);
  --red:#A32D2D;--red-light:#F8EAE8;--red-border:rgba(163,45,45,.32);
  --cream:#F7F4EF;--cream-dark:#EDE8E0;--ink:#1A1A18;--ink-mid:#4A4A45;--ink-light:#8A8A82;--white:#fff;
  --r:14px;--r-lg:22px;--shadow:0 1px 2px rgba(40,30,20,.05),0 10px 30px rgba(40,30,20,.07);
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Montserrat',sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.6;overflow-x:hidden}
button{font-family:inherit}
a{color:var(--green);text-underline-offset:2px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.app-header{background:var(--teal);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;min-height:52px}
.header-title{font-size:13px;font-weight:600;color:#fff;letter-spacing:.02em;line-height:1.2}
.header-tagline{font-size:9.5px;font-weight:300;color:rgba(255,255,255,.85);letter-spacing:.04em}
.header-logo img{width:34px;height:34px;object-fit:contain;display:block}
.header-logo svg{width:34px;height:34px;display:none}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
@media(max-width:480px){.wrap{padding:0 16px}}
/* hero: Body teal and lifting red at about 15% in the corners, cream in the middle */
.hero{background:linear-gradient(135deg,rgba(2,90,90,.15) 0%,rgba(247,244,239,0) 50%,rgba(163,45,45,.15) 100%),var(--cream);padding:28px 0 44px;border-bottom:1px solid var(--cream-dark)}
.badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:26px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.04em}
.badge-pillar{background:var(--green);color:#fff}
.badge-type{background:var(--white);color:var(--green);border:1px solid var(--green-border)}
.badge-lang{margin-left:auto;background:transparent;color:var(--green);border:1px solid var(--green);cursor:pointer;min-height:40px;min-width:46px;justify-content:center;border-radius:22px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:12px}
h1{font-size:clamp(2.1rem,6.5vw,3.6rem);font-weight:800;line-height:1.08;letter-spacing:-.02em;max-width:17ch}
h1 .g{color:var(--green)}
h1 .r{color:var(--red)}
.hero .lead{font-size:clamp(1rem,2.3vw,1.15rem);color:var(--ink-mid);max-width:58ch;margin-top:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.stat{background:var(--white);border:1px solid var(--cream-dark);border-top:5px solid var(--c,var(--green));border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stat .big{font-size:clamp(1.9rem,5.5vw,2.8rem);font-weight:800;line-height:1;color:var(--c,var(--green));letter-spacing:-.02em}
.stat .lbl{font-size:13px;font-weight:500;color:var(--ink-mid);margin-top:8px;line-height:1.45}
.guard{font-size:13.5px;font-weight:600;color:var(--ink-mid);margin-top:14px}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.cta{display:inline-flex;align-items:center;min-height:46px;padding:0 22px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none}
.cta.primary{background:var(--green);color:#fff}
.cta.ghost{border:1.5px solid var(--green);color:var(--green);background:var(--white)}
/* papers strip */
.papers{margin-top:30px}
.papers-title{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.papers-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.paper{background:rgba(255,255,255,.8);border:1px solid var(--cream-dark);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--ink);display:block}
.paper:hover{background:#fff}
.paper .j{font-size:11px;font-weight:700;color:var(--green);letter-spacing:.04em;text-transform:uppercase}
.paper .w{font-size:13px;font-weight:600;line-height:1.35;margin-top:3px}
.paper .n{font-size:12px;color:var(--ink-mid);margin-top:4px;line-height:1.4}
.paper .oa{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:700;color:var(--green);background:var(--green-light);border-radius:10px;padding:2px 8px}
@media(max-width:700px){.stats,.papers-grid{grid-template-columns:1fr}.stats{gap:10px}}
/* steps */
section.step{padding:56px 0 6px}
.stepno{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;margin-bottom:12px}
.stepno.r{background:var(--red)}
h2{font-size:clamp(1.45rem,4vw,2.05rem);font-weight:800;line-height:1.15;letter-spacing:-.01em;margin-bottom:10px}
.lead{font-size:15.5px;color:var(--ink-mid);max-width:62ch}
.panel{background:var(--white);border:1px solid var(--cream-dark);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px;margin-top:20px}
@media(max-width:600px){.panel{padding:16px}}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.controls+.controls{margin-top:-2px}
.chip{min-height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--green-border);background:var(--white);color:var(--green);font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.chip.red{border-color:var(--red-border);color:var(--red)}
.chip.red[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip.view{border-style:dashed}
.chip.view[aria-pressed="true"]{border-style:solid}
.ctl-lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mid);width:100%;margin-bottom:-2px}
.sliderrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:6px;flex-wrap:wrap}
.sliderrow label{font-size:13px;font-weight:600;color:var(--ink-mid)}
.sliderrow output{font-size:1.05rem;font-weight:800;color:var(--green)}
input[type=range]{width:100%;accent-color:var(--green);height:40px;cursor:pointer}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text{font-family:'Montserrat',sans-serif}
.result{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;background:var(--green-light);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.result.red{background:var(--red-light)}
.result .big{font-size:2rem;font-weight:800;line-height:1;color:var(--green)}
.result .big.word{font-size:1.35rem}
.result.red .big{color:var(--red)}
.result .txt{font-size:14.5px;font-weight:600;line-height:1.45;flex:1;min-width:200px}
.result .txt b{font-weight:700}
.result .txt small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-mid);margin-top:3px}
.callout{font-size:14.5px;line-height:1.6;margin-top:14px;padding-left:14px;border-left:4px solid var(--green)}
.callout.red{border-color:var(--red)}
.src{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:11.5px;font-weight:600;color:var(--ink-mid);background:var(--cream);border:1px solid var(--cream-dark);border-radius:999px;padding:4px 12px}
.src::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green)}
.src.red::before{background:var(--red)}
.punch{font-size:clamp(1.15rem,3vw,1.4rem);font-weight:800;line-height:1.35;margin-top:22px;color:var(--red)}
.explain{font-size:14.5px;color:var(--ink-mid);max-width:62ch;margin-top:16px}
/* your week */
.q{font-size:15px;font-weight:700;margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:22px}
@media(max-width:600px){.opts{grid-template-columns:repeat(2,1fr)}}
.opt{min-height:46px;border:1.5px solid var(--green-border);background:var(--white);color:var(--green);border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;padding:6px 10px;line-height:1.3}
.opt[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.opts.red .opt{border-color:var(--red-border);color:var(--red)}
.opts.red .opt[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.mine{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
@media(max-width:760px){.mine{grid-template-columns:1fr}}
.mine .result{margin-top:0;display:block}
.mine .eb{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.mine .red .eb{color:var(--red)}
.mine .main{font-size:16px;font-weight:700;line-height:1.35}
.mine .main.wait{font-size:14px;font-weight:500;color:var(--ink-mid)}
.mine .sub{font-size:13px;color:var(--ink-mid);margin-top:6px;line-height:1.45}
.note{font-size:12.5px;color:var(--ink-mid);margin-top:12px}
.next{border:2px solid var(--green);border-radius:var(--r-lg);padding:18px 20px;margin-top:18px;background:var(--white)}
.next .eb{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.next h3{font-size:18px;font-weight:800;line-height:1.35;margin:4px 0 6px}
.next p{font-size:14px;color:var(--ink-mid)}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px}
.links a{font-size:14px;font-weight:700;min-height:40px;display:inline-flex;align-items:center}
.sub-card{background:var(--white);border:1px solid var(--cream-dark);border-radius:var(--r-lg);padding:22px;margin-top:40px;box-shadow:var(--shadow)}
.sub-title{font-size:18px;font-weight:800;line-height:1.35;margin-bottom:6px}
.sub-text{font-size:14px;color:var(--ink-mid);margin-bottom:16px;max-width:60ch}
.sub-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;background:var(--teal);color:#fff;text-decoration:none;border-radius:var(--r);font-size:15px;font-weight:700}
details.more{margin-top:22px;background:var(--white);border:1px solid var(--cream-dark);border-radius:var(--r)}
details.more>summary{cursor:pointer;list-style:none;min-height:52px;display:flex;align-items:center;gap:8px;padding:0 18px;font-size:14.5px;font-weight:700;color:var(--green)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'\25B8';transition:transform .15s}
details.more[open]>summary::before{transform:rotate(90deg)}
.more-body{padding:0 18px 18px}
.more-body h3{font-size:13.5px;font-weight:800;margin:16px 0 4px}
.more-body p{font-size:13px;color:var(--ink-mid);margin-bottom:8px;max-width:72ch}
.more-body p b{color:var(--ink)}
.tblwrap{overflow-x:auto;max-width:100%;margin:4px 0 8px}
table{border-collapse:collapse;font-size:12px;width:100%;min-width:640px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--cream-dark);vertical-align:top}
th{color:var(--ink-mid);font-weight:600}
td.pp{font-weight:700;white-space:nowrap}
footer{text-align:center;margin-top:28px;padding:20px 0 40px;border-top:1px solid var(--cream-dark)}
footer a{font-size:13px;font-weight:600;text-decoration:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
.stepno.you{width:auto;min-width:38px;padding:0 16px;border-radius:999px;letter-spacing:.04em}
.bridge{margin-top:64px;padding-top:36px;border-top:1px solid var(--cream-dark)}
.bridge h2{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:800;letter-spacing:-.01em;line-height:1.15}
.bridge p{color:var(--ink-mid);margin-top:8px}
.seedata{margin:16px 0 4px;font-weight:700;font-size:14.5px}.seedata a{color:inherit}
</style>
</head>
<body>
<div class="app-header">
  <div><div class="header-title">Swiss Army Mum</div><div class="header-tagline">Not every tool. Just the right ones.</div></div>
  <div class="header-logo"><img src="https://app.swissarmymum.com/icons/logo-stamp.png" alt="SAM logo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="#fff" stroke-width="2"/><text x="17" y="21.5" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="11" font-weight="800" fill="#fff">SAM</text></svg></div>
</div>

<header class="hero">
  <div class="wrap">

<script>
/* DATA: every number on this page, copied as printed in the papers, keyed by the data-sheet id
   (_work/data-sheet.json). Ranges are [value, lower, upper] as printed strings.
   a_  Garcia L et al. 2023, Br J Sports Med 57:979-989. Relative risk vs 0 (no leisure-time activity).
   p1_ Momma H et al. 2022, Br J Sports Med 56:755-763. Relative risk vs no muscle-strengthening.
   p2_ Shojaa M et al. 2020, Front Physiol 11:652. Standardised effect size (SMD), exercise vs control. */
const DATA={
  /* ---------- Garcia 2023 (a_) ---------- */
  "a_rr_allcause_mort_4.375":["0.77","0.73","0.80"],   // Table 1, all-cause mortality, 4.375 mMET-h/week
  "a_rr_allcause_mort_8.75":["0.69","0.65","0.73"],    // Table 1 (also Abstract), 8.75 mMET-h/week
  "a_rr_allcause_mort_17.5":["0.66","0.62","0.70"],    // Table 1, 17.5 mMET-h/week
  "a_rr_cvd_mort_4.375":["0.81","0.77","0.85"],        // Table 1, total CVD mortality
  "a_rr_cvd_mort_8.75":["0.71","0.66","0.77"],         // Table 1 (also Abstract)
  "a_rr_cvd_mort_17.5":["0.65","0.60","0.71"],         // Table 1
  "a_rr_cancer_mort_4.375":["0.90","0.88","0.93"],     // Table 1, total cancer mortality
  "a_rr_cancer_mort_8.75":["0.85","0.81","0.89"],      // Table 1 (also Abstract)
  "a_rr_cancer_mort_17.5":["0.82","0.78","0.86"],      // Table 1
  "a_txt_pctlower_allcause_mort_8.75":["31","27","35"],// Results, Primary dose-response analyses, para 3 (% lower, printed)
  "a_txt_pctlower_cvd_mort_8.75":["29","23","34"],     // Results, para 3 (% lower, printed)
  "a_txt_pctlower_cancer_mort_8.75":["15","11","19"],  // Results, para 3 (% risk difference, printed)
  "a_txt_pif_allcause_8.75":["15.7","13.2","18.2"],    // Results, Potential population impact (assumes the link is causal)
  "a_abs_pif_allcause_8.75":["15.7","13.1","18.2"],    // Abstract: same estimate, lower bound printed as 13.1

const hund=s=>{const neg=String(s).trim().startsWith("-");const[a,b="0"]=String(s).replace("-","").split(".");return (neg?-1:1)*(parseInt(a,10)*100+parseInt((b+"00").slice(0,2),10))};
function ph(e){ /* [v,lo,hi] -> plain-language direction, whole percent, from printed strings only */
  if(!e||e.length<2) return {dir:"ref",p:0};
  const v=hund(e[0]),lo=hund(e[1]),hi=hund(e[2]);
  if(lo<=100&&hi>=100) return {dir:"same",p:Math.abs(v-100),a:100-lo,b:hi-100};
  return v>100?{dir:"up",p:v-100,a:lo-100,b:hi-100}:{dir:"down",p:100-v,a:100-hi,b:100-lo};
}
const pr=e=>({dir:"down",p:+e[0],a:+e[1],b:+e[2]}); /* printed "% lower" [p,lo,hi] */
const lowOf=e=>({v:100-hund(e[0]),lo:100-hund(e[2]),hi:100-hund(e[1])}); /* for plotting: % lower, negative = higher */

  moreSum:"How sure are we? Sources and details",
  more:()=>`<h3>How sure are we?</h3>
<p><b>Patterns, not proof (for two of the three).</b> Garcia and Momma followed large groups of people for years. They show which groups did better, not that moving or lifting caused it. Shojaa pools exercise trials, some randomised and some not (the split isn't published), so it is the only "doing it changed something" evidence here, and only for bone density.</p>
<p><b>Relative, not personal.</b> A percentage lower risk compares groups of people. The papers don't give anyone's personal chance.</p>
<p><b>Three measures, never one scale.</b> Garcia measures everyday movement (mostly walking, cycling and sport) against deaths; Momma measures minutes of strength training; Shojaa measures bone density on a scan. The two "minutes" axes count different activities, so the numbers can't be added or swapped.</p>
<p><b>Who was studied.</b> Garcia: adults in large general-population cohorts, more than ${DATA.a_n_participants} million people, followed for a median of ${DATA.a_followup_median} years; activity was mostly self-reported. Momma: ${DATA.p1_n_studies} studies, mostly from the USA. Shojaa: women after menopause, study average ages ${DATA.p2_age_range[0]} to ${DATA.p2_age_range[1]}, mostly healthy (${DATA.p2_healthy_studies} of ${DATA.p2_n_studies} studies), in programmes of ${DATA.p2_prog_length_range[0]} to ${DATA.p2_prog_length_range[1]} months, most often ${DATA.p2_prog_freq} sessions a week.</p>
<p><b>Women-specific results.</b> Garcia: the authors report "some evidence of stronger associations" in women than in men for dying early, heart and circulation deaths and heart and circulation disease, and the reverse for cancer (the numbers are only in the online supplement). Momma: results by sex and a women-only diabetes analysis exist only in the online supplement, not in the main paper. Shojaa: every participant was a woman after menopause.</p>
<p><b>Counts.</b> Garcia's "results" per outcome (for example ${DATA.a_allcause_events} for dying early) are not cohorts: men's and women's results can count separately. Momma pools ${DATA.p1_allcause_dose_40min.n} studies for the minutes curve on dying early (${DATA.p1_allcause_any_n} for any strength training versus none, ${DATA.p1_combined_n} for moving, lifting or both). Shojaa pools ${DATA.p2_lumbar_smd.n} exercise groups for the spine, ${DATA.p2_fn_smd.n} for the top of the thigh bone and ${DATA.p2_thip_smd.n} for the whole hip; participants per site are not reported.</p>
<p><b>Where the papers agree, and where they differ.</b> Both cohort papers find the biggest differences at modest amounts. Garcia's movement curve flattens out; Momma's strength curve comes back to the comparison level at about ${BK[0]} to ${BK[1]} minutes. That is strength training in few studies, and it does not mean moving can be "too much". In Momma's "both" view, "moving" means aerobic activity as each study defined it.</p>
<p><b>The authors' own limitations.</b> Garcia: self-reported activity, weaker evidence at high amounts, possible reverse causation (people who are unwell move less); its preventable-deaths estimates assume the link is causal (Results, "Potential population impact"). Momma: very few studies, possible publication bias, certainty rated "${DATA.p1_ctx_grade_allcause}" (GRADE), effect of high amounts unclear. Shojaa: large variation between trials, signs of publication bias, a true effect "diluted" by weak programmes (the authors' word), and no result in grams or percent. The ${DATA.p1_cvd_combined_pct}% for strength plus moving is for heart and circulation deaths.</p>
<p><b>Shojaa's yardstick.</b> Results are standardised effect sizes: differences measured in "spread" units, so trials with different scanners can be pooled. The authors call the effect "rather small" (abstract: "rather low") and give no small, moderate or large thresholds.</p>

  subText:"Cada semana, Swiss Army Mum convierte la investigación sobre sueño, alimentación, movimiento, cerebro y mente en una sola cosa que puedes hacer de verdad. Para mujeres ocupadas de más de 35 años. En inglés.",

  moreSum:"¿Qué tan seguros estamos? Fuentes y detalles",
  more:()=>`<h3>¿Qué tan seguros estamos?</h3>
<p><b>Patrones, no pruebas (en dos de los tres).</b> Garcia y Momma siguieron a grandes grupos de personas durante años. Muestran qué grupos salieron mejor, no que moverse o hacer fuerza fuera la causa. Shojaa reúne ensayos de ejercicio, unos aleatorizados y otros no (el reparto no se publicó), así que es la única prueba de que «hacerlo cambió algo», y solo para la densidad ósea.</p>
<p><b>Relativo, no personal.</b> Un porcentaje de menos riesgo compara grupos de personas. Los artículos no dan la probabilidad personal de nadie.</p>
<p><b>Tres medidas, nunca una sola escala.</b> Garcia mide el movimiento cotidiano (sobre todo caminar, bici y deporte) frente a las muertes; Momma mide minutos de fuerza; Shojaa mide la densidad ósea en un escáner. Los dos ejes de «minutos» cuentan actividades distintas, así que las cifras no se pueden sumar ni intercambiar.</p>
<p><b>A quién se estudió.</b> Garcia: adultos de grandes cohortes de población general, más de ${DATA.a_n_participants} millones de personas, seguidas una mediana de ${DATA.a_followup_median} años; la actividad era sobre todo autodeclarada. Momma: ${DATA.p1_n_studies} estudios, la mayoría de EE. UU. Shojaa: mujeres tras la menopausia, con edades medias de ${DATA.p2_age_range[0]} a ${DATA.p2_age_range[1]} años según el estudio, la mayoría sanas (${DATA.p2_healthy_studies} de ${DATA.p2_n_studies} estudios), en programas de ${DATA.p2_prog_length_range[0]} a ${DATA.p2_prog_length_range[1]} meses, casi siempre ${DATA.p2_prog_freq} sesiones a la semana.</p>
<p><b>Resultados en mujeres.</b> Garcia: los autores señalan «algunas pruebas de asociaciones más fuertes» en las mujeres que en los hombres para morir antes de tiempo y para las muertes y la enfermedad del corazón y la circulación, y lo contrario para el cáncer (las cifras solo están en el suplemento en línea). Momma: los resultados por sexo y un análisis de diabetes solo en mujeres están únicamente en el suplemento en línea, no en el artículo principal. Shojaa: todas las participantes eran mujeres tras la menopausia.</p>
<p><b>Recuentos.</b> Los «resultados» de Garcia por desenlace (por ejemplo, ${DATA.a_allcause_events} para morir antes de tiempo) no son cohortes: los resultados de hombres y mujeres pueden contar por separado. Momma reúne ${DATA.p1_allcause_dose_40min.n} estudios para la curva de minutos sobre morir antes de tiempo (${DATA.p1_allcause_any_n} para algo de fuerza frente a nada, ${DATA.p1_combined_n} para moverse, fuerza o las dos). Shojaa reúne ${DATA.p2_lumbar_smd.n} grupos de ejercicio para la columna, ${DATA.p2_fn_smd.n} para el cuello del fémur y ${DATA.p2_thip_smd.n} para la cadera completa; no se indica cuántas participantes hay por zona.</p>
<p><b>En qué coinciden y en qué difieren.</b> Los dos estudios de cohortes encuentran las mayores diferencias con cantidades modestas. La curva de movimiento de Garcia se aplana; la curva de fuerza de Momma vuelve al nivel del grupo de comparación hacia los ${BK[0]} a ${BK[1]} minutos. Eso es entrenamiento de fuerza en pocos estudios, y no significa que moverse pueda ser «demasiado». En la vista «las dos» de Momma, «moverse» es actividad aeróbica tal como la definió cada estudio.</p>
<p><b>Las limitaciones que señalan los autores.</b> Garcia: actividad autodeclarada, pruebas más débiles con cantidades altas, posible causalidad inversa (quien está enfermo se mueve menos); sus estimaciones de muertes evitables dan por hecho que la relación es causal (Resultados, «Potential population impact»). Momma: muy pocos estudios, posible sesgo de publicación, certeza calificada de «muy baja» (GRADE), efecto de cantidades altas poco claro. Shojaa: gran variación entre ensayos, señales de sesgo de publicación, un efecto real «diluido» por programas flojos (palabra de los autores) y ningún resultado en gramos ni en porcentaje. El ${pc(DATA.p1_cvd_combined_pct)} de fuerza más movimiento corresponde a muertes por enfermedad del corazón y la circulación.</p>
<p><b>La escala de Shojaa.</b> Los resultados son tamaños del efecto estandarizados: diferencias medidas en unidades de «dispersión», para poder juntar ensayos con escáneres distintos. Los autores califican el efecto de «más bien pequeño» (en el resumen, «más bien bajo») y no dan umbrales de pequeño, moderado o grande.</p>
${numbersTable()}

<p>Una explicación independiente, no elaborada ni respaldada por los autores ni por las revistas.</p>

}
function render(){
  const l=L();
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{el.innerHTML=t(el.dataset.t)});
  $("lang").textContent=l.langBtn;$("lang").setAttribute("aria-label",l.langAria);
  $("st1").textContent=pc(DATA["a_txt_pctlower_allcause_mort_8.75"][0]);
  $("st2").textContent=pc(DATA.p1_allcause_dose_40min_pct);
  $("st3").textContent=pc(DATA.p1_cvd_combined_pct);
  const P=DATA.papers,urls=[P.a.doi,P.p1.doi,P.p2.doi].map(d=>"https://doi.org/"+d);
  $("papers").innerHTML=l.papers().map((p,i)=>`<a class="paper" href="${urls[i]}" target="_blank" rel="noopener"><div class="j">${p[0]}</div><div class="w">${p[1]}</div><div class="n">${p[2]}</div><span class="oa">${l.oa}</span></a>`).join("");
  chips("g1",l.outs1,"o1",st.o1);$("g1").setAttribute("aria-label",l.outs1.map(x=>x[1]).join(", "));
  step2ctl();
  chips("g3",l.sites,"site",st.site);chips("t3",l.timings(),"tm",st.tm);
  $("g3").setAttribute("aria-label",l.siteLbl);$("t3").setAttribute("aria-label",l.tmLbl);
  $("o1").innerHTML=l.q1opts().map((n,i)=>`<button type="button" class="opt" data-q1="${i}" aria-pressed="${st.q1===i}">${n}</button>`).join("");
  $("o2").innerHTML=l.q2opts().map((n,i)=>`<button type="button" class="opt" data-q2="${i}" aria-pressed="${st.q2===i}">${n}</button>`).join("");
  $("more").innerHTML=t("more");
  step1();chart2();step3();mine();
}
const press=(sel,b)=>document.querySelectorAll(sel).forEach(x=>x.setAttribute("aria-pressed",x===b));
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;
  if(b.id==="lang"){lang=lang==="en"?"es":"en";render();return}
  if(d.o1){st.o1=d.o1;press("#g1 .chip",b);step1()}
  if(d.v){if(st.view!==d.v){st.view=d.v;step2ctl();chart2()}}
  if(d.o2){st.o2=d.o2;press("#g2 .chip",b);chart2()}
  if(d.site){st.site=d.site;press("#g3 .chip",b);step3()}
  if(d.tm){st.tm=d.tm;press("#t3 .chip",b);step3()}
  if(d.q1!==undefined){st.q1=+d.q1;press("#o1 .opt",b);mine()}
  if(d.q2!==undefined){st.q2=+d.q2;press("#o2 .opt",b);mine()}
});
$("sl").addEventListener("input",e=>{st.stop=+e.target.value;step1()});
let wasN=narrow();addEventListener("resize",()=>{if(narrow()!==wasN){wasN=narrow();chart1();chart2();chart3()}});
render();
</script>
</body>
</html>

<p><b>Dos formas de contar.</b> El estudio del ritmo da una estimación básica y otra más prudente que además tiene en cuenta actividad física, ingresos, tabaco, trabajo por turnos y medicación. Esta página muestra la prudente. Analizando horas y ritmo a la vez, el grupo más regular seguía teniendo un ${pc(m3.p)} menos de riesgo (margen probable: entre ${m3.a} y ${pc(m3.b)} menos).</p>

<p><b>Financiación.</b> Dos autores principales del estudio del ritmo reciben financiación de empresas de iluminación y de salud circadiana.</p>

  const nw=narrow(),W=nw?360:760,H=nw?312:330,PL=nw?40:52,PR=14,PT=22,PB=52,maxY=65;
  const X=i=>PL+i*(W-PL-PR)/(HOURS.length-1), Y=v=>PT+(maxY-v)/maxY*(H-PT-PB);
  const d=DATA.a[st.grp];
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L().c1y}">`;
  [0,20,40,60].forEach(v=>{s+=`<line x1="${PL}" x2="${W-PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EDE8E0"/><text x="${PL-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#8A8A82">+${pc(v)}</text>`});
  const pts=HOURS.map((h,i)=>{const e=d[h];return {h,i,v:e.length>1?hund(e[0])-100:0,lo:e.length>1?hund(e[1])-100:0,hi:e.length>1?hund(e[2])-100:0}});
  s+=`<polyline points="${pts.map(p=>X(p.i)+","+Y(p.v)).join(" ")}" fill="none" stroke="#9FCFC6" stroke-width="2" stroke-dasharray="5 5"/>`;
  pts.forEach(p=>{
    const on=p.h===st.h,cx=X(p.i);
    if(p.h!==7) s+=`<line x1="${cx}" x2="${cx}" y1="${Y(p.lo)}" y2="${Y(p.hi)}" stroke="${on?"#025A5A":"#7FB8AE"}" stroke-width="${on?4:3}" stroke-linecap="round"/>`;
    s+=`<circle cx="${cx}" cy="${Y(p.v)}" r="${on?9:6}" fill="${on?"#025A5A":"#3D7A78"}" stroke="#fff" stroke-width="2"/>`;
    if(on&&p.h!==7) s+=`<text x="${cx}" y="${Y(Math.max(p.hi,p.v))-12}" text-anchor="middle" font-size="${nw?13:15}" font-weight="800" fill="#025A5A">+${pc(p.v)}</text>`;
    if(p.h===7) s+=`<text x="${cx}" y="${Y(0)-14}" text-anchor="middle" font-size="11" font-weight="700" fill="#4A4A45">${L().c1ref}</text>`;
    s+=`<text x="${cx}" y="${H-PB+20}" text-anchor="middle" font-size="12" font-weight="${on?800:500}" fill="${on?"#025A5A":"#4A4A45"}">${p.h}h</text>`;
  });
  s+=nw?`<text x="${PL}" y="${H-20}" font-size="11" fill="#8A8A82">${L().c1x}</text><text x="${PL}" y="${H-5}" font-size="11" fill="#8A8A82">${L().c1guide}</text></svg>`:`<text x="${PL}" y="${H-8}" font-size="11" fill="#8A8A82">${L().c1x} · ${L().c1guide}</text></svg>`;
  $("c1").innerHTML=s;
}
function chart2(){
  const nw=narrow(),k=st.sort,W=nw?360:760,lab=nw?150:300,rowH=nw?44:40,H=5*rowH+30,max=40;
  const rows=k==="sri"?L().sriRows:L().durRows(DATA.p1.durRange),col=k==="sri"?"#BA7517":"#3D7A78";
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L().c2axis(k)}">`;
  ["q1","q2","q3","q4","q5"].forEach((q,i)=>{
    const y=i*rowH+6,r=q==="q1"?null:ph(DATA.p1[k][q]),val=r?r.p:0,bw=val/max*(W-lab-60);
    const name=rows[i];
    if(nw){const parts=name.split(" (");s+=`<text x="0" y="${y+14}" font-size="12" font-weight="700" fill="#1A1A18">${parts[0]}</text>`;if(parts[1])s+=`<text x="0" y="${y+29}" font-size="10.5" fill="#4A4A45">(${parts[1]}</text>`;}
    else s+=`<text x="0" y="${y+18}" font-size="13" font-weight="600" fill="#1A1A18">${name}</text>`;
    if(!r) s+=`<circle cx="${lab+6}" cy="${y+13}" r="6" fill="${col}"/><text x="${lab+18}" y="${y+17}" font-size="12" fill="#4A4A45">${L().cmp}</text>`;
    else s+=`<rect x="${lab}" y="${y+3}" width="${bw}" height="20" rx="5" fill="${col}" opacity="${0.45+i*0.13}"/><text x="${lab+bw+8}" y="${y+18}" font-size="13" font-weight="800" fill="${col}">−${pc(val)}</text>`;
  });
  s+=`<text x="0" y="${H-4}" font-size="11" fill="#8A8A82">${L().c2axis(k)}</text></svg>`;
  $("c2").innerHTML=s;
  $("c2note").textContent=L().c2note[k];
}
function step1(){
  $("slOut").textContent=st.h+(lang==="es"?NB:"")+"h";
  const [b,tx]=L().r1(st.h,ph(DATA.a[st.grp][st.h]),st.grp);
  $("r1big").textContent=b;$("r1txt").innerHTML=tx;$("c1note").textContent=L().c1note[st.grp];
  chart1();
}
function mine(){
  const l=L();
  $("m1eb").textContent=l.m1eb(st.myH);
  if(st.myH===null){$("m1").textContent=l.m1wait;$("m1").className="main wait";$("m1s").textContent=""}
  else{const[a,b]=l.m1(st.myH,ph(DATA.a.w[st.myH]));$("m1").textContent=a;$("m1").className="main";$("m1s").textContent=b}
  if(st.myR===null){$("m2").textContent=l.m2wait;$("m2").className="main wait";$("m2s").textContent=""}
  else{const[a,b]=l.m2(st.myR,st.myR==="q1"?null:ph(DATA.p1.sri[st.myR]),ph(DATA.p1.sri.q5));$("m2").textContent=a;$("m2").className="main";$("m2s").textContent=b}
  const[nh,np]=l.next(st.myH,st.myR);$("nextH").textContent=nh;$("nextP").textContent=np;
}
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{el.innerHTML=t(el.dataset.t)});
  $("lang").textContent=L().langBtn;
  $("st1").textContent="+"+pc(ph(DATA.a.w[9]).p);
  $("st2").textContent="−"+pc(ph(DATA.p1.sri.q5).p);
  $("st3").textContent=lang==="es"?"1,5 M":"1.5M";
  const urls=["https://doi.org/10.1038/srep21480","https://doi.org/10.1093/sleep/zsad253","https://doi.org/10.3390/healthcare13172085"];
  $("papers").innerHTML=L().papers.map((p,i)=>`<a class="paper" href="${urls[i]}" target="_blank" rel="noopener"><div class="j">${p[0]}</div><div class="w">${p[1]}</div><div class="n">${p[2]}</div><span class="oa">${L().oa}</span></a>`).join("");
  $("grp").innerHTML=L().grps.map(([k,n])=>`<button type="button" class="chip" data-g="${k}" aria-pressed="${st.grp===k}">${n}</button>`).join("");
  $("sort").innerHTML=L().sorts.map(([k,n])=>`<button type="button" class="chip ${k==="sri"?"amb":""}" data-s="${k}" aria-pressed="${st.sort===k}">${n}</button>`).join("");
  $("bars").innerHTML=[["pre"],["early"],["late"],["post"]].map(([k],i)=>{
    const v=DATA.p2[k],a=Array.isArray(v)?+v[0]:+v,b=Array.isArray(v)?+v[1]:a;
    const val=Array.isArray(v)?`${a}–${pc(b)}`:pc(a);
    return `<li class="bar-row"><span class="bar-label">${L().stages[i]}</span><span class="bar-val">${val}</span><span class="bar-track"><span class="bar-fill" style="width:${a}%"></span>${b>a?`<span class="bar-range" style="left:${a}%;width:${b-a}%"></span>`:""}</span></li>`;
  }).join("");
  $("hours").innerHTML=HOURS.map(h=>`<button type="button" class="opt" data-h="${h}" aria-pressed="${st.myH===h}">${h}${lang==="es"?NB:""}h</button>`).join("");
  $("rhythm").innerHTML=L().rOpts.map(([k,a,b])=>`<button type="button" class="opt" data-r="${k}" aria-pressed="${st.myR===k}"><b>${a}</b>${b}</button>`).join("");
  $("more").innerHTML=t("more");
  step1();chart2();mine();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="lang"){lang=lang==="en"?"es":"en";render();return}
  if(b.dataset.g){st.grp=b.dataset.g;document.querySelectorAll("#grp .chip").forEach(x=>x.setAttribute("aria-pressed",x===b));step1()}
  if(b.dataset.s){st.sort=b.dataset.s;document.querySelectorAll("#sort .chip").forEach(x=>x.setAttribute("aria-pressed",x===b));chart2()}
  if(b.dataset.h){st.myH=+b.dataset.h;document.querySelectorAll("#hours .opt").forEach(x=>x.setAttribute("aria-pressed",x===b));mine()}
  if(b.dataset.r){st.myR=b.dataset.r;document.querySelectorAll("#rhythm .opt").forEach(x=>x.setAttribute("aria-pressed",x===b));mine()}
});
$("sl").addEventListener("input",e=>{st.h=+e.target.value;step1()});
let wasN=narrow();addEventListener("resize",()=>{if(narrow()!==wasN){wasN=narrow();chart1();chart2()}});
render();
</script>
</body>
</html>

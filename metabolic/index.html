*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

.progress-bar { height: 3px; background: var(--cream-dark); border-radius: 2px; margin-bottom: 1.75rem; overflow: hidden; }
.progress-fill { height: 100%; background: var(--teal); border-radius: 2px; transition: width 0.3s ease; }
.q-counter { font-size: 11px; color: var(--ink-light); font-weight: 500; margin-bottom: 0.4rem; letter-spacing: 0.03em; }

.q-text { font-size: 17px; font-weight: 500; color: var(--ink); line-height: 1.45; margin-bottom: 1.75rem; letter-spacing: -0.01em; }
.options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.75rem; }
.option-btn { width: 100%; padding: 13px 16px; background: var(--white); border: 1px solid var(--cream-dark); border-radius: var(--radius); font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 400; color: var(--ink-mid); cursor: pointer; text-align: left; display: flex; align-items: center; gap: 12px; transition: all 0.15s; }
.option-btn:hover { border-color: var(--teal-mid); background: var(--teal-light); color: var(--teal); }

.dim-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1.5rem; }

.reset-btn { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--cream-dark); border-radius: var(--radius); font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 500; color: var(--ink-mid); cursor: pointer; transition: background 0.15s; }

.footer { text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--cream-dark); }
.footer a { font-size: 12px; font-weight: 500; color: var(--teal); text-decoration: none; letter-spacing: 0.02em; }
.footer a:hover { text-decoration: underline; text-underline-offset: 2px; }
.disclaimer a { color: var(--teal); text-underline-offset: 2px; }
</style>
</head>

  ['lang-toggle-intro'].forEach(id => { const el = document.getElementById(id); if(el) el.textContent = s.langToggle; });
  const h1 = document.getElementById('intro-h1'); if(h1) h1.textContent = s.introH1;
  const body = document.getElementById('intro-body'); if(body) body.textContent = s.introBody;
  const note = document.getElementById('intro-note'); if(note) note.textContent = s.introNote;
  const startBtn = document.getElementById('start-btn'); if(startBtn) startBtn.textContent = s.startBtn;
  const backBtn = document.getElementById('back-btn'); if(backBtn) backBtn.textContent = s.backBtn;
  const resetBtn = document.getElementById('reset-btn'); if(resetBtn) resetBtn.textContent = s.retakeBtn;
  const disclaimer = document.getElementById('disclaimer'); if(disclaimer) disclaimer.innerHTML = s.disclaimer;
  const screenQ = document.getElementById('screen-question');
  if (screenQ && screenQ.classList.contains('active')) renderQuestion();
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function startAssessment() {
  answers = new Array(7).fill(null);
  current = 0;
  renderQuestion();
  show('screen-question');
}

function renderQuestion() {
  const s = t();
  const q = s.questions[current];
  document.getElementById('progressFill').style.width = ((current / 7) * 100) + '%';
  document.getElementById('qCounter').textContent = s.qOf(current + 1);
  document.getElementById('qDim').textContent = s.dimLabels[q.dim];
  document.getElementById('qText').textContent = q.text;

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  s.optionLabels.forEach((label, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (answers[current] === i ? ' selected' : '');
    btn.innerHTML = `<span class="option-num">${i}</span>${label}`;
    btn.onclick = () => selectAnswer(i);
    opts.appendChild(btn);
  });

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = current === 6 ? s.seeResult : s.nextBtn;
  nextBtn.classList.toggle('enabled', answers[current] !== null);
  document.getElementById('back-btn').textContent = s.backBtn;
}

function selectAnswer(v) {
  answers[current] = v;
  document.querySelectorAll('.option-btn').forEach((btn, i) => btn.classList.toggle('selected', i === v));
  document.getElementById('nextBtn').classList.add('enabled');
}

function goNext() {
  if (answers[current] === null) return;
  if (current < 6) { current++; renderQuestion(); }
  else showResult();
}

function goBack() {
  if (current > 0) { current--; renderQuestion(); }
  else show('screen-intro');
}

// answers[] stores the clicked option index (0=Never ... 4=Always).
// Health value inverts it: Never (0) -> 4 (best), Always (4) -> 0 (worst).
function healthValue(i) { return 4 - answers[i]; }

function dimensionScore(group) {
  return group.questionIdx.reduce((sum, qi) => sum + healthValue(qi), 0);
}

function getScoreClass(score, max) {
  const frac = score / max;
  if (frac >= 0.75) return 'good';
  if (frac >= 0.5) return 'mid';
  return 'low';
}

function showResult() {
  const s = t();
  const total = dimGroups.reduce((sum, g) => sum + dimensionScore(g), 0);
  document.getElementById('scoreNum').textContent = total;
  document.getElementById('score-label').textContent = s.scoreLabel;

  const interpEl = document.getElementById('scoreInterp');
  const totalFrac = total / TOTAL_MAX;
  if (totalFrac >= 0.75) { interpEl.textContent = s.interpGood; interpEl.className = 'result-interp good'; }
  else if (totalFrac >= 0.5) { interpEl.textContent = s.interpMid; interpEl.className = 'result-interp mid'; }
  else { interpEl.textContent = s.interpLow; interpEl.className = 'result-interp low'; }

  drawRadar();

  document.getElementById('dimGrid').innerHTML = dimGroups.map(g => {
    const score = dimensionScore(g);
    return `
    <div class="dim-pill">
      <div class="dim-pill-label">${s.dimLabels[g.key]}</div>
      <div class="dim-pill-score ${getScoreClass(score, g.max)}">${score}/${g.max}</div>
    </div>
  `;
  }).join('');

  let lowestKey = dimGroups[0].key, lowestFrac = 1;
  dimGroups.forEach(g => {
    const frac = dimensionScore(g) / g.max;
    if (frac < lowestFrac) { lowestFrac = frac; lowestKey = g.key; }
  });
  const lever = s.levers[lowestKey];

  document.getElementById('levers').innerHTML = `
    <div class="lever-block primary">
      <div class="lever-eyebrow">${s.lever80}</div>
      <div class="lever-title">${lever.title}</div>
      <div class="lever-text">${lever.text}</div>
    </div>
    <div class="lever-block secondary">
      <div class="lever-eyebrow">${s.goDeeper}</div>
      <div class="lever-title">${s.goDeeperTitle}</div>
      <div class="lever-text">${s.goDeeperText} <a href="${postUrl}" class="teal-link" target="_blank">${s.goDeeperLink}</a></div>
    </div>
  `;

  const today = new Date().toLocaleDateString(lang === 'es' ? 'es-ES' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('retakeNote').innerHTML = s.retakeNote(today, total);
  document.getElementById('reset-btn').textContent = s.retakeBtn;
  document.getElementById('disclaimer').innerHTML = s.disclaimer;

  document.getElementById('progressFill').style.width = '100%';
  show('screen-result');
}

function drawRadar() {
  const s = t();
  const canvas = document.getElementById('radarChart');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2, R = 88, n = dimGroups.length;
  const dimLabels = dimGroups.map(g => s.dimShort[g.key]);
  const fracs = dimGroups.map(g => dimensionScore(g) / g.max);
  const angleOffset = -Math.PI / 2;
  const angles = Array.from({ length: n }, (_, i) => angleOffset + (2 * Math.PI * i) / n);

  ctx.clearRect(0, 0, W, H);

  for (let ring = 1; ring <= 4; ring++) {
    const r = (R * ring) / 4;
    ctx.beginPath();
    angles.forEach((a, i) => { const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
    ctx.closePath(); ctx.strokeStyle = '#EDE8E0'; ctx.lineWidth = 1; ctx.stroke();
  }

  angles.forEach(a => {
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a));
    ctx.strokeStyle = '#EDE8E0'; ctx.lineWidth = 1; ctx.stroke();
  });

  ctx.beginPath();
  angles.forEach((a, i) => { const val = fracs[i]; const x = cx + R * val * Math.cos(a), y = cy + R * val * Math.sin(a); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
  ctx.closePath(); ctx.fillStyle = 'rgba(44,95,93,0.12)'; ctx.fill(); ctx.strokeStyle = '#2C5F5D'; ctx.lineWidth = 2; ctx.stroke();

  angles.forEach((a, i) => {
    const val = fracs[i]; const x = cx + R * val * Math.cos(a), y = cy + R * val * Math.sin(a);
    ctx.beginPath(); ctx.arc(x, y, 4, 0, 2 * Math.PI); ctx.fillStyle = '#2C5F5D'; ctx.fill();
  });

  ctx.font = '500 10px Montserrat, sans-serif'; ctx.fillStyle = '#4A4A45'; ctx.textBaseline = 'middle';
  const labelR = R + 18;
  angles.forEach((a, i) => {
    const cos = Math.cos(a);
    ctx.textAlign = cos > 0.15 ? 'left' : (cos < -0.15 ? 'right' : 'center');
    const lx = cx + labelR * cos, ly = cy + labelR * Math.sin(a);
    ctx.fillText(dimLabels[i], lx, ly);
  });
}

function resetAll() { answers = new Array(7).fill(null); current = 0; show('screen-intro'); }

renderUI();
</script>

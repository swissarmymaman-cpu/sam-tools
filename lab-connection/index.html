<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAM Lab: Connection</title>
<meta name="description" content="SAM Lab: is it who's around, or how it feels? Real data from three open-access reviews on connection, loneliness and living longer, turned into something you can play with.">
<link rel="icon" type="image/png" href="https://app.swissarmymum.com/icons/logo-stamp.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#315E63;--mind:#E32C2D;
  --red:#A32D2D;--red-light:#F7E6E4;--red-soft:#E3B4B4;--red-border:rgba(163,45,45,.3);
  --blue:#00579B;--blue-light:#E3EEF7;--blue-soft:#A8C6E0;--blue-border:rgba(0,87,155,.3);
  --cream:#F7F4EF;--cream-dark:#EDE8E0;--ink:#1A1A18;--ink-mid:#4A4A45;--ink-light:#8A8A82;--white:#fff;
  --r:14px;--r-lg:22px;--shadow:0 1px 2px rgba(40,30,20,.05),0 10px 30px rgba(40,30,20,.07);
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Montserrat',sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.6;overflow-x:hidden}
button{font-family:inherit}
a{color:var(--red);text-underline-offset:2px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.app-header{background:var(--teal);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;min-height:52px}
.header-title{font-size:13px;font-weight:600;color:#fff;letter-spacing:.02em;line-height:1.2}
.header-tagline{font-size:9.5px;font-weight:300;color:rgba(255,255,255,.75);letter-spacing:.04em}
.header-logo img{width:34px;height:34px;object-fit:contain;display:block}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
/* hero: deep red and Glow blue at about 15% in opposite corners, cream in the middle */
.hero{background:linear-gradient(135deg,#EAD6D2 0%,#F7F4EF 55%,#D2DCE2 100%);padding:28px 0 44px;border-bottom:1px solid var(--cream-dark)}
.badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:26px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.04em}
.badge-pillar{background:var(--mind);color:#fff}
.badge-type{background:var(--white);color:var(--red);border:1px solid var(--red-border)}
.badge-lang{margin-left:auto;background:transparent;color:var(--red);border:1px solid var(--red);cursor:pointer;min-height:40px;min-width:46px;justify-content:center;border-radius:22px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:12px}
h1{font-size:clamp(2.1rem,6.5vw,3.6rem);font-weight:800;line-height:1.08;letter-spacing:-.02em;max-width:16ch}
h1 .r{color:var(--red)}
h1 .b{color:var(--blue)}
.hero .lead{font-size:clamp(1rem,2.3vw,1.15rem);color:var(--ink-mid);max-width:58ch;margin-top:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.stat{background:var(--white);border:1px solid var(--cream-dark);border-top:5px solid var(--c,var(--red));border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stat .big{font-size:clamp(1.9rem,5.5vw,2.8rem);font-weight:800;line-height:1;color:var(--c,var(--red));letter-spacing:-.02em}
.stat .lbl{font-size:13px;font-weight:500;color:var(--ink-mid);margin-top:8px;line-height:1.45}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.cta{display:inline-flex;align-items:center;min-height:46px;padding:0 22px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none}
.cta.primary{background:var(--red);color:#fff}
.cta.ghost{border:1.5px solid var(--red);color:var(--red);background:var(--white)}
/* papers strip */
.papers{margin-top:30px}
.papers-title{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.papers-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.paper{background:rgba(255,255,255,.75);border:1px solid var(--cream-dark);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--ink);display:block}
.paper:hover{background:#fff}
.paper .j{font-size:11px;font-weight:700;color:var(--red);letter-spacing:.04em;text-transform:uppercase}
.paper .w{font-size:13px;font-weight:600;line-height:1.35;margin-top:3px}
.paper .n{font-size:12px;color:var(--ink-mid);margin-top:4px;line-height:1.4}
.paper .oa{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:700;color:var(--blue);background:var(--blue-light);border-radius:10px;padding:2px 8px}
@media(max-width:700px){.stats,.papers-grid{grid-template-columns:1fr}.stats{gap:10px}}
/* steps */
section.step{padding:56px 0 6px}
.stepno{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;margin-bottom:12px}
.stepno.blu{background:var(--blue)}
h2{font-size:clamp(1.45rem,4vw,2.05rem);font-weight:800;line-height:1.15;letter-spacing:-.01em;margin-bottom:10px}
.lead{font-size:15.5px;color:var(--ink-mid);max-width:62ch}
.panel{background:var(--white);border:1px solid var(--cream-dark);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px;margin-top:20px}
@media(max-width:600px){.panel{padding:16px}}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{min-height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--red-border);background:var(--white);color:var(--red);font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip.blu{border-color:var(--blue-border);color:var(--blue)}
.chip.blu[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text{font-family:'Montserrat',sans-serif}
.result{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;background:var(--red-light);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.result.blu{background:var(--blue-light)}
.result .big{font-size:2rem;font-weight:800;line-height:1;color:var(--red)}
.result.blu .big{color:var(--blue)}
.result .txt{font-size:14.5px;font-weight:600;line-height:1.45;flex:1;min-width:200px}
.result .txt small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-mid);margin-top:3px}
.callout{font-size:14.5px;line-height:1.6;margin-top:14px;padding-left:14px;border-left:4px solid var(--red)}
.callout.blu{border-color:var(--blue)}
.src{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:11.5px;font-weight:600;color:var(--ink-mid);background:var(--cream);border:1px solid var(--cream-dark);border-radius:999px;padding:4px 12px}
.src::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--red)}
.src.blu::before{background:var(--blue)}
/* step 3: two separate reviews, side by side */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.duo{grid-template-columns:1fr}}
.mini{border:1px solid var(--cream-dark);border-radius:var(--r);padding:14px}
.mini .mh{font-size:13px;font-weight:800;color:var(--blue)}
.mini .mc{font-size:12px;color:var(--ink-mid);margin-bottom:6px}
.punch{font-size:clamp(1.15rem,3vw,1.4rem);font-weight:800;line-height:1.35;margin-top:22px;color:var(--blue)}
/* your connection */
.q{font-size:15px;font-weight:700;margin-bottom:8px}
.qhint{font-size:13px;color:var(--ink-mid);margin:-4px 0 10px}
.two{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:22px;max-width:420px}
.opt{min-height:46px;border:1.5px solid var(--red-border);background:var(--white);color:var(--red);border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;padding:6px 12px;line-height:1.3}
.opt[aria-pressed="true"]{background:var(--red);color:#fff;border-color:var(--red)}
.rhythm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:600px){.rhythm{grid-template-columns:1fr}}
.rhythm .opt{text-align:left;font-weight:500;border-color:var(--blue-border);color:var(--ink)}
.rhythm .opt b{display:block;font-weight:800;color:var(--blue)}
.rhythm .opt[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.rhythm .opt[aria-pressed="true"] b{color:#fff}
.mine{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
@media(max-width:600px){.mine{grid-template-columns:1fr}}
.mine .result{margin-top:0;display:block}
.mine .eb{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.mine .blu .eb{color:var(--blue)}
.mine .ttl{font-size:17px;font-weight:800;line-height:1.3}
.mine .main{font-size:15px;font-weight:600;line-height:1.4;margin-top:4px}
.mine .main.wait{font-size:14px;font-weight:500;color:var(--ink-mid)}
.mine .sub{font-size:12.5px;color:var(--ink-mid);margin-top:4px}
.note{font-size:12.5px;color:var(--ink-mid);margin-top:12px}
.next{border:2px solid var(--red);border-radius:var(--r-lg);padding:18px 20px;margin-top:18px;background:var(--white)}
.next .eb{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.next h3{font-size:18px;font-weight:800;line-height:1.35;margin:4px 0 6px}
.next p{font-size:14px;color:var(--ink-mid)}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px}
.links a{font-size:14px;font-weight:700;min-height:40px;display:inline-flex;align-items:center}
.sub-card{background:var(--white);border:1px solid var(--cream-dark);border-radius:var(--r-lg);padding:22px;margin-top:40px;box-shadow:var(--shadow)}
.sub-title{font-size:18px;font-weight:800;line-height:1.35;margin-bottom:6px}
.sub-text{font-size:14px;color:var(--ink-mid);margin-bottom:16px;max-width:60ch}
.sub-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;background:var(--teal);color:#fff;text-decoration:none;border-radius:var(--r);font-size:15px;font-weight:700}
details.more{margin-top:22px;background:var(--white);border:1px solid var(--cream-dark);border-radius:var(--r)}
details.more>summary{cursor:pointer;list-style:none;min-height:52px;display:flex;align-items:center;gap:8px;padding:0 18px;font-size:14.5px;font-weight:700;color:var(--red)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'\25B8';transition:transform .15s}
details.more[open]>summary::before{transform:rotate(90deg)}
.more-body{padding:0 18px 18px}
.more-body h3{font-size:13.5px;font-weight:800;margin:16px 0 4px}
.more-body p{font-size:13px;color:var(--ink-mid);margin-bottom:8px;max-width:72ch}
.more-body p b{color:var(--ink)}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-size:12px;margin:4px 0 8px;width:100%;max-width:640px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--cream-dark);vertical-align:top}
th{color:var(--ink-mid);font-weight:600}
footer{text-align:center;margin-top:28px;padding:20px 0 40px;border-top:1px solid var(--cream-dark)}
footer a{font-size:13px;font-weight:600;text-decoration:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
.stepno.you{width:auto;min-width:38px;padding:0 16px;border-radius:999px;letter-spacing:.04em}
.bridge{margin-top:64px;padding-top:36px;border-top:1px solid var(--cream-dark)}
.bridge h2{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:800;letter-spacing:-.01em;line-height:1.15}
.bridge p{color:var(--ink-mid);margin-top:8px}
.seedata{margin:16px 0 4px;font-weight:700;font-size:14.5px}.seedata a{color:inherit}
</style>
</head>
<body>
<div class="app-header">
  <div><div class="header-title">Swiss Army Mum</div><div class="header-tagline">Not every tool. Just the right ones.</div></div>

<script>
/* DATA: every number on this page, copied as printed in the papers (data-sheet.json, keyed by id).
   e = [value, lower, upper] as printed (Holt-Lunstad from the *_printed strings, so 1.50 keeps its trailing zero).

   a_  Holt-Lunstad J, Smith TB, Layton JB. PLOS Medicine 2010;7(7):e1000316.
       Odds ratios of SURVIVAL: higher = better for the more connected group. Never flipped into a risk of death.
       Loneliness, social isolation and living alone are "(inversed)" in Table 4: not lonely / not isolated / living with others, compared with the rest.
       k = studies (text p. 4 and p. 8) or effect sizes (Table 4, p. 11), as marked.
   p1_ Rico-Uribe LA et al. PLOS ONE 2018;13(1):e0190033.
       Pooled hazard ratios of DEATH (hazard and risk ratios combined): higher = worse for the lonely group.
   p2_ Nakou A et al. Aging Clinical and Experimental Research 2025;37:29.
       Pooled hazard ratios of DEATH, all causes: higher = worse for the exposed group (lonely / isolated / living alone).
       est = estimates (tables count estimates, not studies). */
const DATA={
  a:{
    overall:{e:["1.50","1.42","1.59"],k:"148",n:"308849"},    // a_overall_or: Abstract; Results, Omnibus Analysis, para 1 (p. 4); k = studies
    overall_pct:"50",                                         // a_overall_pct: authors' own "50% increased likelihood of survival", same place
    structural:{e:["1.57","1.46","1.70"],k:"63"},              // a_structural_or: Results, Structural aspects, para 1 (p. 8); k = studies
    functional:{e:["1.46","1.28","1.66"],k:"24"},              // a_functional_or: Results, Functional aspects, para 1 (p. 8); k = studies
    combined:{e:["1.44","1.32","1.58"],k:"61"},                // a_combined_or: Results, Combined assessments, para 1 (p. 8); k = studies
    married:{e:["1.33","1.20","1.48"],k:"62"},                 // a_married: Table 4 (p. 11); k = effect sizes
    social_networks:{e:["1.45","1.32","1.59"],k:"71"},         // a_social_networks: Table 4 (p. 11)
    social_integration:{e:["1.52","1.36","1.69"],k:"45"},      // a_social_integration: Table 4 (p. 11)
    complex_measures:{e:["1.91","1.63","2.23"],k:"30"},        // a_complex_measures: Table 4 (p. 11); authors' "91% increase in odds" (a_complex_pct, Discussion p. 9)
    social_isolation:{e:["1.40","1.06","1.86"],k:"8"},         // a_social_isolation (inversed): Table 4 (p. 11)
    living_alone:{e:["1.19","0.99","1.44"],k:"17"},            // a_living_alone (inversed): Table 4 (p. 11); range includes 1
    perceived_support:{e:["1.35","1.22","1.49"],k:"73"},       // a_perceived_support: Table 4 (p. 11)
    received_support:{e:["1.22","0.91","1.63"],k:"9"},         // a_received_support: Table 4 (p. 11); range includes 1
    loneliness:{e:["1.45","1.08","1.94"],k:"8"},               // a_loneliness (inversed): Table 4 (p. 11)
    multifaceted:{e:["1.47","1.34","1.60"],k:"67"},            // a_multifaceted: Table 4 (p. 11)
    mean_age:"63.9",                                          // a_mean_age: Results para 1 (p. 4)
    pct_female:"49",                                          // a_pct_female: Results para 1 (p. 4)
    followup:"7.5",                                           // a_followup_mean: Results para 1 (p. 4)
    editors:{more:"5",of:"100"}                               // a_editors_five_more: Editors' Summary (p. 20), written by the PLOS Medicine editors, not the authors

  more:()=>`<h3>How sure are we?</h3>
<p><b>Links, not proof.</b> All three papers are reviews of studies that followed people over time. They show which groups lived longer, not that changing your social life will change your health. <b>No CC BY trial shows that adding more connection changes health outcomes.</b> It can also run the other way: people who are ill may see fewer people.</p>
<p><b>Odds are not chances.</b> "${pc(A.overall_pct)} higher odds of surviving" does not mean ${A.overall_pct} more people alive out of ${A.editors.of}. The PLOS Medicine editors (not the authors) put it this way: in a hypothetical (imaginary) sample of ${A.editors.of} people, by the time half had died, there would be ${A.editors.more} more people alive with stronger relationships than with weaker ones.</p>
<p><b>Who was studied.</b> Mostly older adults. Holt-Lunstad: average age ${dec(A.mean_age)}, ${pc(A.pct_female)} women, followed for ${dec(A.followup)} years on average. Nakou: ages ${P2.age[0]} to ${P2.age[1]}. Rico-Uribe: only ${P1.under50.n} articles had a sample younger than ${P1.under50.age} years. In midlife, you're younger than almost everyone studied.</p>
<p><b>Women.</b> Holt-Lunstad gives no figure for women alone (${pc(A.pct_female)} of people were women, and the result held across sex). Rico-Uribe's women's figure rests on ${P1.women.k} studies, ${P1.women_heart_only} of which counted only heart deaths, and the gap between women and men was never formally tested. Nakou found no clear difference across the sex groups (studies of both sexes, women, men) for loneliness (P = ${dec(P2.p_sex.loneliness)}) or few contacts (P = ${dec(P2.p_sex.isolation)}). Living alone did differ across the sex groups (P = ${dec(P2.p_sex.livingalone)}): for women, the range includes no difference.</p>
<p><b>Where the reviews disagree.</b> For loneliness, Rico-Uribe found ${pc(ph(P1.overall.e).p)} higher risk of dying and Nakou ${pc(ph(P2.loneliness.all.e).p)}. They pooled different studies, ages and methods, so we show both, side by side, and never average them.</p>
<p><b>What was counted.</b> Holt-Lunstad's Table 4 and Nakou's tables count results (effect sizes or estimates), not whole studies: one study can give several. Rico-Uribe pools two kinds of ratio (hazard and risk ratios) together. Holt-Lunstad's loneliness figure is odds of surviving for people who were not lonely, a different measure in the opposite direction, so it stays out of step 3.</p>
<p><b>Other limits.</b> Living alone is a weak stand-in for isolation: you can live alone with a full social life. Most studies ignored how good the relationships were. Holt-Lunstad pooled the least-adjusted estimate from each study; among structural measures, estimates with statistical controls showed smaller links than raw ones (Table 3). Nakou found signs of missing small studies (publication bias) in the loneliness and few-contacts results. Nakou's cancer results for loneliness and living alone rest on a single study each.</p>
${numbersTable()}

  more:()=>`<h3>¿Hasta qué punto estamos seguros?</h3>
<p><b>Relaciones, no pruebas.</b> Los tres artículos son revisiones de estudios que siguieron a personas a lo largo del tiempo. Muestran qué grupos vivieron más, no que cambiar tu vida social vaya a cambiar tu salud. <b>Ningún ensayo con licencia CC BY demuestra que añadir más conexión cambie los resultados de salud.</b> Además, la relación puede ir al revés: las personas enfermas pueden ver a menos gente.</p>
<p><b>Ese ${pc(A.overall_pct)} no significa ${A.overall_pct} personas más de cada ${A.editors.of}.</b> «Un ${pc(A.overall_pct)} más de posibilidades de sobrevivir» (en estadística, odds) es una comparación entre grupos, no un recuento. Los editores de PLOS Medicine (no los autores) lo explicaron así: en una muestra hipotética (imaginaria) de ${A.editors.of} personas, cuando hubiera muerto la mitad, habría ${A.editors.more} personas vivas más con relaciones más fuertes que con relaciones más débiles.</p>
<p><b>A quién se estudió.</b> Sobre todo a personas mayores. Holt-Lunstad: edad media de ${dec(A.mean_age)} años, ${pc(A.pct_female)} mujeres, seguimiento medio de ${dec(A.followup)} años. Nakou: edades de ${P2.age[0]} a ${P2.age[1]} años. Rico-Uribe: solo ${P1.under50.n} artículos tenían una muestra menor de ${P1.under50.age} años. En la mediana edad, eres más joven que casi todas las personas estudiadas.</p>
<p><b>Mujeres.</b> Holt-Lunstad no da una cifra solo para mujeres (el ${pc(A.pct_female)} eran mujeres, y el resultado se mantuvo en ambos sexos). La cifra de mujeres de Rico-Uribe se basa en ${P1.women.k} estudios, ${P1.women_heart_only} de ellos solo con muertes por enfermedad del corazón, y la diferencia entre mujeres y hombres nunca se comprobó formalmente. Nakou no encontró una diferencia clara entre los grupos por sexo (estudios con ambos sexos, mujeres, hombres) para la soledad (P = ${dec(P2.p_sex.loneliness)}) ni para tener pocos contactos (P = ${dec(P2.p_sex.isolation)}). Vivir solo sí fue distinto entre los grupos por sexo (P = ${dec(P2.p_sex.livingalone)}): en las mujeres, el margen incluye «sin diferencia».</p>
<p><b>En qué no coinciden las revisiones.</b> Para la soledad, Rico-Uribe encontró un ${pc(ph(P1.overall.e).p)} más de riesgo de morir y Nakou un ${pc(ph(P2.loneliness.all.e).p)}. Juntaron estudios, edades y métodos distintos, así que mostramos las dos, una al lado de la otra, y nunca las promediamos.</p>
<p><b>Qué se contó.</b> La tabla 4 de Holt-Lunstad y las tablas de Nakou cuentan resultados (tamaños del efecto o estimaciones), no estudios completos: un estudio puede aportar varios. Rico-Uribe junta dos tipos de razón: cocientes de riesgos (hazard ratios) y riesgos relativos. La cifra de soledad de Holt-Lunstad son posibilidades de sobrevivir para quienes no sentían soledad, una medida distinta en la dirección contraria, así que no aparece en el paso 3.</p>
<p><b>Otros límites.</b> Vivir solo es una medida débil del aislamiento: se puede vivir solo con una vida social llena. La mayoría de los estudios no miraron lo buenas que eran las relaciones. Holt-Lunstad juntó la estimación menos ajustada de cada estudio; en las medidas estructurales, las estimaciones con controles estadísticos mostraron relaciones más débiles que los datos sin ajustar (tabla 3). Nakou encontró señales de que faltan estudios pequeños (sesgo de publicación) en los resultados de soledad y de pocos contactos. Los resultados de Nakou sobre cáncer para la soledad y para vivir solo se basan en un único estudio cada uno.</p>

  s+=row(x.aNames.overall,A.overall.e,`${A.overall.k} ${x.studies}, ${num(A.overall.n)} ${x.people}`,"p. 4");
  ["structural","functional","combined"].forEach(k=>{s+=row(x.aNames[k],A[k].e,`${A[k].k} ${x.studies}`,"p. 8")});
  [...CH1.s,...CH1.f,"multifaceted"].forEach(k=>{s+=row(x.aNames[k],A[k].e,`${A[k].k} ${x.es}`,lang==="es"?"tabla 4":"Table 4")});
  s+=`</table></div><p>${x.capP1}</p><div class="tw"><table>${head}`;
  s+=row(x.p1Names.overall,P1.overall.e,`${P1.overall.k} ${x.studies}, ${num(P1.overall.n)} ${x.people}`,lang==="es"?"figura 2":"Fig 2");
  ["women","men"].forEach(k=>{s+=row(x.p1Names[k],P1[k].e,`${P1[k].k} ${x.studies}, ${x.notPub}`,lang==="es"?"figura 3":"Fig 3")});
  s+=`</table></div><p>${x.capP2}</p><div class="tw"><table>${head}`;
  EXPO.forEach((ex,i)=>{
    const d=P2[ex],tb=lang==="es"?`tabla ${i+1}`:`Table ${i+1}`;
    s+=row(`${x.p2Names[ex]}, ${x.g.all}`,d.all.e,`${d.all.k} ${x.studies}, ${d.all.est} ${x.est}, ${num(d.all.n)} ${x.people}`,lang==="es"?`figura ${i+2}`:`Fig ${i+2}`);

  });
  return s+`</table></div>`;
}

const narrow=()=>innerWidth<600;
/* Forest-style chart: one row per published result, dot = value, whisker = published range,
   one continuous solid "comparison group" line at 1.00 from the first row to the last. Labels carry a white halo so the line passes behind them. */
function forest(o){
  const l=L(),nw=o.fixedW?true:narrow(),W=o.fixedW||(nw?360:760);
  const PL=nw?16:320,PR=nw?60:70,rh=nw?70:52,top=30,n=o.rows.length,H=top+n*rh+28;
  const X=v=>PL+(v-o.dom[0])/(o.dom[1]-o.dom[0])*(W-PL-PR);
  const halo='paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round"';
  const x1=X(1);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria}"><title>${o.aria}</title>`;
  const lineTop=(nw&&n===1)?top+26:top-6; /* single-row narrow chart: start the line below the row label so it never runs through the words */
  s+=`<line x1="${x1}" x2="${x1}" y1="${lineTop}" y2="${top+n*rh}" stroke="#1A1A18" stroke-width="1.5"/>`;
  s+=x1<80?`<text x="${x1-8}" y="${top-12}" font-size="11" font-weight="700" fill="#1A1A18" ${halo}>${l.cmp}</text>`
          :`<text x="${x1}" y="${top-12}" text-anchor="middle" font-size="11" font-weight="700" fill="#1A1A18" ${halo}>${l.cmp}</text>`;
  o.rows.forEach((r,i)=>{
    const y=top+i*rh,cy=nw?y+44:y+rh/2,p=ph(r.e),v=r.e.map(Number);
    if(nw) s+=`<text x="0" y="${y+14}" font-size="13.5" font-weight="700" fill="#1A1A18" ${halo}>${r.lab[0]}</text><text x="0" y="${y+29}" font-size="12" fill="#4A4A45" ${halo}>${r.lab[1]}</text>`;
    else s+=`<text x="0" y="${cy-3}" font-size="13" font-weight="600" fill="#1A1A18">${r.lab[0]}</text><text x="0" y="${cy+13}" font-size="11.5" fill="#4A4A45">${r.lab[1]}</text>`;
    s+=`<line x1="${X(v[1])}" x2="${X(v[2])}" y1="${cy}" y2="${cy}" stroke="${o.col}" stroke-width="3" stroke-linecap="round"/>`;
    s+=`<circle cx="${X(v[0])}" cy="${cy}" r="7" fill="${o.col}" stroke="#fff" stroke-width="2"/>`;
    s+=`<text x="${X(v[2])+8}" y="${cy+5}" font-size="13.5" font-weight="800" fill="${o.col}">+${pc(p.p)}</text>`;
    if(p.incl) s+=`<text x="${X(v[1])}" y="${cy+20}" font-size="10.5" font-weight="600" fill="#4A4A45" ${halo}>${l.incl}</text>`;
  });
  s+=`<text x="${x1+8}" y="${H-6}" font-size="11.5" font-weight="600" fill="#4A4A45">${o.axis}</text></svg>`;
  return s;
}

  const nt=l.c1note[st.c1];$("c1note").textContent=typeof nt==="function"?nt():nt;
}
function step2(){
  const l=L(),g=st.c2,rows=EXPO.map(ex=>({lab:l.pRows[ex],e:P2[ex][g].e}));
  $("c2").innerHTML=forest({rows,dom:[0.8,1.9],col:BLUE,axis:l.axRisk,aria:l.c2aria});
  const d=P2.isolation[g],[b,tx]=l.r2(g,ph(d.e),d);
  $("r2big").textContent=b;$("r2txt").innerHTML=tx;
  const nt=l.c2note[g];$("c2note").textContent=typeof nt==="function"?nt():nt;
}
function step3(){
  const l=L(),g=st.c3,ka={all:"overall",w:"women",m:"men"}[g],da=P1[ka],db=P2.loneliness[g];
  /* two separate charts, each its own axis and credit: never one scale, never averaged */
  $("c3a").innerHTML=forest({rows:[{lab:l.rows3[g],e:da.e}],dom:[0.9,1.8],col:BLUE,axis:l.axRisk,aria:l.c3aria(l.m3aH),fixedW:300});
  $("c3b").innerHTML=forest({rows:[{lab:l.rows3[g],e:db.e}],dom:[0.9,1.8],col:BLUE,axis:l.axRisk,aria:l.c3aria(l.m3bH),fixedW:300});
  $("m3aC").textContent=l.cnt3a(g,da);$("m3bC").textContent=l.cnt3b(g,db);
  const [b,tx]=l.r3(g,ph(da.e),ph(db.e));
  $("r3big").textContent=b;$("r3txt").innerHTML=tx;
  const nt=l.c3note[g];$("c3note").textContent=typeof nt==="function"?nt():nt;
}
function mine(){
  const l=L(),lo=st.lonely,wk=st.week;
  if(lo===null||wk===null){
    ["m1t","m1s","m2t","m2s","m2r"].forEach(id=>$(id).textContent="");
    $("m1").textContent=l.mWait;$("m1").className="main wait";$("m2").textContent=l.mWait;
  }else{
    /* Holt-Lunstad: the connected group is always the subject; she is in the comparison group unless not lonely with plenty of contact */
    const ka=lo==="yes"?"loneliness":wk==="few"?"social_isolation":wk==="alone"?"living_alone":"overall";
    const ra=ph(A[ka].e),[t1,m1]=l.mA(ka,ra);
    $("m1t").textContent=t1;$("m1").textContent=m1;$("m1").className="main";$("m1s").textContent=l.plaus(ra,"",ka==="living_alone");
    /* Nakou, women's figures */
    const kn=lo==="yes"?"loneliness":wk==="few"?"isolation":wk==="alone"?"livingalone":"neither";
    const rn=ph(P2[kn==="neither"?"isolation":kn].w.e),[t2,m2]=l.mN(kn,rn);
    $("m2t").textContent=t2;$("m2").textContent=m2;$("m2").className="main";$("m2s").textContent=l.plaus(rn,"",kn==="livingalone");
    $("m2r").textContent=lo==="yes"?l.mRico(ph(P1.women.e)):"";
  }
  const[nh,np]=l.next(lo,wk);$("nextH").textContent=nh;$("nextP").textContent=np;
}
function chips(id,list,key,cls){
  $(id).innerHTML=list.map(([k,n])=>`<button type="button" class="chip${cls?" "+cls:""}" data-${key}="${k}" aria-pressed="${st[key]===k}">${n}</button>`).join("");
}
function render(){
  const l=L();
  document.documentElement.lang=lang;document.title=l.title;
  document.querySelectorAll("[data-t]").forEach(el=>{el.innerHTML=t(el.dataset.t)});
  $("lang").textContent=l.langBtn;$("lang").setAttribute("aria-label",l.langAria);
  $("st1").textContent="+"+pc(A.overall_pct);
  $("st2").textContent="+"+pc(ph(P2.isolation.w.e).p);
  $("st3").textContent="+"+pc(ph(A.complex_measures.e).p);
  const urls=["https://doi.org/10.1371/journal.pmed.1000316","https://doi.org/10.1371/journal.pone.0190033","https://doi.org/10.1007/s40520-024-02925-1"];
  $("papers").innerHTML=l.papers().map((p,i)=>`<a class="paper" href="${urls[i]}" target="_blank" rel="noopener"><div class="j">${p[0]}</div><div class="w">${p[1]}</div><div class="n">${p[2]}</div><span class="oa">${l.oa}</span></a>`).join("");
  chips("g1",l.chips1,"c1","");chips("g2",l.chips,"c2","blu");chips("g3",l.chips,"c3","blu");
  $("g1").setAttribute("aria-label",l.g1Aria);$("g2").setAttribute("aria-label",l.g2Aria);$("g3").setAttribute("aria-label",l.g3Aria);
  $("lonely").innerHTML=l.q1Opts.map(([k,a])=>`<button type="button" class="opt" data-lonely="${k}" aria-pressed="${st.lonely===k}">${a}</button>`).join("");
  $("week").innerHTML=l.q2Opts.map(([k,a,b])=>`<button type="button" class="opt" data-week="${k}" aria-pressed="${st.week===k}"><b>${a}</b>${b}</button>`).join("");
  $("more").innerHTML=t("more");
  step1();step2();step3();mine();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="lang"){lang=lang==="en"?"es":"en";render();return}
  const set=(key,fn)=>{st[key]=b.dataset[key];b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));fn()};
  if(b.dataset.c1) set("c1",step1);
  if(b.dataset.c2) set("c2",step2);
  if(b.dataset.c3) set("c3",step3);
  if(b.dataset.lonely) set("lonely",mine);
  if(b.dataset.week) set("week",mine);
});
let wasN=narrow();addEventListener("resize",()=>{if(narrow()!==wasN){wasN=narrow();step1();step2()}});
render();
</script>
</body>
</html>

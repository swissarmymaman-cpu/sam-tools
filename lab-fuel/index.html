<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAM Lab: Fuel</title>
<meta name="description" content="SAM Lab: is it what you add, or what you cut? Real data from three open-access papers on Mediterranean eating and ultra-processed food, turned into something you can play with.">
<link rel="icon" type="image/png" href="https://app.swissarmymum.com/icons/logo-stamp.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#315E63;--green:#025A5A;--green-mid:#3D7A78;--green-light:#E0F2F1;--green-soft:#B9D9D3;--green-border:rgba(2,90,90,.28);
  --blue:#00579B;--blue-mid:#3A78B0;--blue-light:#E4EEF7;--blue-border:rgba(0,87,155,.32);
  --cream:#F7F4EF;--cream-dark:#EDE8E0;--ink:#1A1A18;--ink-mid:#4A4A45;--ink-light:#8A8A82;--white:#fff;
  --r:14px;--r-lg:22px;--shadow:0 1px 2px rgba(40,30,20,.05),0 10px 30px rgba(40,30,20,.07);
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Montserrat',sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.6;overflow-x:hidden}
button{font-family:inherit}
a{color:var(--green);text-underline-offset:2px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.app-header{background:var(--teal);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;min-height:52px}
.header-title{font-size:13px;font-weight:600;color:#fff;letter-spacing:.02em;line-height:1.2}
.header-tagline{font-size:9.5px;font-weight:300;color:rgba(255,255,255,.75);letter-spacing:.04em}
.header-logo img{width:34px;height:34px;object-fit:contain;display:block}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}
/* hero: teal and blue at about 15% in the corners, cream in the middle */
.hero{background:linear-gradient(135deg,rgba(2,90,90,.15) 0%,rgba(247,244,239,0) 45%,rgba(247,244,239,0) 55%,rgba(0,87,155,.15) 100%),var(--cream);padding:28px 0 44px;border-bottom:1px solid var(--cream-dark)}
.badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:26px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.04em}
.badge-pillar{background:var(--green);color:#fff}
.badge-type{background:var(--white);color:var(--green);border:1px solid var(--green-border)}
.badge-lang{margin-left:auto;background:transparent;color:var(--green);border:1px solid var(--green);cursor:pointer;min-height:40px;min-width:46px;justify-content:center;border-radius:22px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:12px}
h1{font-size:clamp(2.1rem,6.5vw,3.6rem);font-weight:800;line-height:1.08;letter-spacing:-.02em;max-width:17ch}
h1 .g{color:var(--green)}
h1 .b{color:var(--blue)}
.hero .lead{font-size:clamp(1rem,2.3vw,1.15rem);color:var(--ink-mid);max-width:58ch;margin-top:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.stat{background:var(--white);border:1px solid var(--cream-dark);border-top:5px solid var(--c,var(--green));border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stat.cut{border-top-style:dashed}
.stat .big{font-size:clamp(1.9rem,5.5vw,2.8rem);font-weight:800;line-height:1;color:var(--c,var(--green));letter-spacing:-.02em}
.stat .big small{font-size:.45em;font-weight:700;letter-spacing:0}
.stat .lbl{font-size:13px;font-weight:500;color:var(--ink-mid);margin-top:8px;line-height:1.45}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.cta{display:inline-flex;align-items:center;min-height:46px;padding:0 22px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none}
.cta.primary{background:var(--green);color:#fff}
.cta.ghost{border:1.5px solid var(--green);color:var(--green);background:var(--white)}
/* papers strip */
.papers{margin-top:30px}
.papers-title{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mid);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.papers-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.paper{background:rgba(255,255,255,.75);border:1px solid var(--cream-dark);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--ink);display:block}
.paper:hover{background:#fff}
.paper .j{font-size:11px;font-weight:700;color:var(--green);letter-spacing:.04em;text-transform:uppercase}
.paper.cut .j{color:var(--blue)}
.paper .w{font-size:13px;font-weight:600;line-height:1.35;margin-top:3px}
.paper .n{font-size:12px;color:var(--ink-mid);margin-top:4px;line-height:1.4}
.paper .oa{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:700;color:var(--green);background:var(--green-light);border-radius:10px;padding:2px 8px}
@media(max-width:700px){.stats,.papers-grid{grid-template-columns:1fr}.stats{gap:10px}}
/* steps */
section.step{padding:56px 0 6px}
.stepno{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;margin-bottom:12px}
.stepno.b{background:var(--white);color:var(--blue);border:3px solid var(--blue)}
h2{font-size:clamp(1.45rem,4vw,2.05rem);font-weight:800;line-height:1.15;letter-spacing:-.01em;margin-bottom:10px}
.lead{font-size:15.5px;color:var(--ink-mid);max-width:62ch}
.def{font-size:14px;color:var(--ink-mid);max-width:66ch;margin-top:10px}
.def b{color:var(--ink)}
.panel{background:var(--white);border:1px solid var(--cream-dark);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px;margin-top:20px}
@media(max-width:600px){.panel{padding:16px}}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.ctl-lbl{font-size:12.5px;font-weight:700;color:var(--ink-mid);margin-right:4px}
.chip{min-height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--green-border);background:var(--white);color:var(--green);font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.chip.blu{border:1.5px dashed var(--blue-border);color:var(--blue)}
.chip.blu[aria-pressed="true"]{background:var(--blue);border:1.5px solid var(--blue);color:#fff}
.chip.seg{border-radius:12px;font-size:12.5px}
.scoreline{font-size:13px;color:var(--ink-mid);margin:-2px 0 14px;max-width:70ch}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text,.forest svg text{font-family:'Montserrat',sans-serif}
/* step 1 forest: one button per published row */
.forest{display:flex;flex-direction:column;gap:3px;margin-top:4px;position:relative}
.refline{position:absolute;width:1.5px;background:#8A8A82;pointer-events:none;z-index:1}
.callout:empty{display:none}
.frow{--rowbg:var(--white)}.frow[aria-pressed="true"]{--rowbg:var(--green-light)}
.frow .fl,.frow .fv{position:relative;z-index:2}
.frow .fl b,.frow .fl span{display:table;background:var(--rowbg);padding-right:3px}
.frow .fv{justify-self:end;background:var(--rowbg)}
.frow,.faxis{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) 116px;gap:2px 12px;align-items:center}
.frow{width:100%;text-align:left;background:var(--white);border:1.5px solid transparent;border-radius:12px;padding:5px 8px;cursor:pointer;color:var(--ink);font-size:13px}
.frow:hover{border-color:var(--green-border)}
.frow[aria-pressed="true"]{border-color:var(--green);background:var(--green-light)}
.faxis{padding:0 9.5px}
.fl b{display:block;font-size:13px;font-weight:700;line-height:1.3}
.fl span{display:block;font-size:11.5px;color:var(--ink-mid);line-height:1.35}
.fv{font-size:13px;font-weight:800;color:var(--green);text-align:right;line-height:1.3}
.ft{display:block;width:100%;height:auto;overflow:visible}
@media(max-width:600px){
  .frow,.faxis{grid-template-columns:minmax(0,1fr) auto}
  .frow .fl,.faxis .fl{grid-row:1;grid-column:1}
  .frow .fv,.faxis .fv{grid-row:1;grid-column:2}
  .frow .ft,.faxis .ft{grid-row:2;grid-column:1/-1}
  .faxis .fl,.faxis .fv{display:none}
  .faxis .ft{grid-row:1}
}
.result{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;background:var(--green-light);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.result.blu{background:var(--blue-light);border:1.5px dashed var(--blue-border)}
.result .big{font-size:2rem;font-weight:800;line-height:1;color:var(--green)}
.result.blu .big{color:var(--blue)}
.result .txt{font-size:14.5px;font-weight:600;line-height:1.45;flex:1;min-width:200px}
.result .txt small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-mid);margin-top:3px}
.readout{font-size:14px;line-height:1.5;margin-top:12px;padding:12px 14px;border:1.5px dashed var(--blue);border-radius:var(--r);color:var(--ink)}
.readout b{color:var(--blue)}
.callout{font-size:14.5px;line-height:1.6;margin-top:14px;padding-left:14px;border-left:4px solid var(--green)}
.callout.blu{border-left:4px dashed var(--blue)}
.src{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:11.5px;font-weight:600;color:var(--ink-mid);background:var(--cream);border:1px solid var(--cream-dark);border-radius:999px;padding:4px 12px}
.src::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green)}
.src.blu::before{background:transparent;border:2px solid var(--blue);width:6px;height:6px}
/* why bars (Ahmad mediators) */
.why{margin-top:20px;padding-top:16px;border-top:1px solid var(--cream-dark)}
.why h3{font-size:15px;font-weight:800;margin-bottom:2px}
.why p{font-size:13px;color:var(--ink-mid);margin-bottom:12px}
.bars{list-style:none;display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.bar-label{font-size:14px;font-weight:600}
.bar-label small{display:block;font-size:12px;font-weight:400;color:var(--ink-mid);line-height:1.4;margin-top:1px}
.why .eg{font-size:13.5px;color:var(--ink);background:var(--green-light);border-radius:10px;padding:10px 12px;margin:10px 0 4px}
.bar-val{font-size:14px;font-weight:800;color:var(--green)}
.bar-track{grid-column:1/-1;height:16px;background:var(--cream);border:1px solid var(--cream-dark);border-radius:8px;position:relative;overflow:hidden}
.bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--green-mid);border-radius:8px 0 0 8px}
.overlap{font-size:13.5px;font-weight:800;color:var(--green);margin-top:12px}
.punch{font-size:clamp(1.15rem,3vw,1.4rem);font-weight:800;line-height:1.35;margin-top:22px;color:var(--green)}
/* your plate */
.q{font-size:15px;font-weight:700;margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
.opt{min-height:46px;border:1.5px solid var(--green-border);background:var(--white);color:var(--green);border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;padding:6px 12px;line-height:1.3}
.opt[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.opts.blu .opt{border:1.5px dashed var(--blue-border);color:var(--blue)}
.opts.blu .opt[aria-pressed="true"]{background:var(--blue);border:1.5px solid var(--blue);color:#fff}
.mine{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
@media(max-width:760px){.mine{grid-template-columns:1fr}}
.mine .result{margin-top:0;display:block}
.mine .eb{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.mine .blu .eb{color:var(--blue)}
.mine .main{font-size:16px;font-weight:700;line-height:1.35}
.mine .main.wait{font-size:14px;font-weight:500;color:var(--ink-mid)}
.mine .sub{font-size:12.5px;color:var(--ink-mid);margin-top:4px}
.note{font-size:13px;font-weight:600;color:var(--ink);margin-top:12px}
.next{border:2px solid var(--green);border-radius:var(--r-lg);padding:18px 20px;margin-top:18px;background:var(--white)}
.next .eb{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.next h3{font-size:18px;font-weight:800;line-height:1.35;margin:4px 0 6px}
.next p{font-size:14px;color:var(--ink-mid)}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px}
.links a{font-size:14px;font-weight:700;min-height:40px;display:inline-flex;align-items:center}
.sub-card{background:var(--white);border:1px solid var(--cream-dark);border-radius:var(--r-lg);padding:22px;margin-top:40px;box-shadow:var(--shadow)}
.sub-title{font-size:18px;font-weight:800;line-height:1.35;margin-bottom:6px}
.sub-text{font-size:14px;color:var(--ink-mid);margin-bottom:16px;max-width:60ch}
.sub-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;background:var(--teal);color:#fff;text-decoration:none;border-radius:var(--r);font-size:15px;font-weight:700}
details.more{margin-top:22px;background:var(--white);border:1px solid var(--cream-dark);border-radius:var(--r)}
details.more>summary{cursor:pointer;list-style:none;min-height:52px;display:flex;align-items:center;gap:8px;padding:0 18px;font-size:14.5px;font-weight:700;color:var(--green)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'\25B8';transition:transform .15s}
details.more[open]>summary::before{transform:rotate(90deg)}
.more-body{padding:0 18px 18px}
.more-body h3{font-size:13.5px;font-weight:800;margin:16px 0 4px}
.more-body h4{font-size:12.5px;font-weight:800;margin:12px 0 2px}
.more-body p{font-size:13px;color:var(--ink-mid);margin-bottom:8px;max-width:72ch}
.more-body p b{color:var(--ink)}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:12px;margin:4px 0 8px;width:100%;min-width:560px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--cream-dark);vertical-align:top}
th{color:var(--ink-mid);font-weight:600}
footer{text-align:center;margin-top:28px;padding:20px 0 40px;border-top:1px solid var(--cream-dark)}
footer a{font-size:13px;font-weight:600;text-decoration:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<div class="app-header">
  <div><div class="header-title">Swiss Army Mum</div><div class="header-tagline">Not every tool. Just the right ones.</div></div>
  <div class="header-logo"><img src="https://app.swissarmymum.com/icons/logo-stamp.png" alt="SAM logo" onerror="this.style.display='none'"></div>
</div>

<header class="hero">
  <div class="wrap">
    <div class="badges">
      <span class="badge badge-pillar">Body · <span data-t="area"></span></span>
      <span class="badge badge-type">SAM Lab</span>
      <button class="badge badge-lang" id="lang" type="button"></button>
    </div>
    <div class="eyebrow" data-t="eyebrow"></div>
    <h1 data-t="h1"></h1>
    <p class="lead" data-t="heroLead"></p>
    <div class="stats">
      <div class="stat"><div class="big" id="st1"></div><div class="lbl" data-t="st1"></div></div>
      <div class="stat" style="--c:var(--green-mid)"><div class="big" id="st2"></div><div class="lbl" data-t="st2"></div></div>
      <div class="stat cut" style="--c:var(--blue)"><div class="big" id="st3"></div><div class="lbl" data-t="st3"></div></div>
    </div>
    <div class="ctas"><a class="cta primary" href="#s1" data-t="ctaWalk"></a><a class="cta ghost" href="#s4" data-t="ctaMine"></a></div>
    <div class="papers">
      <div class="papers-title" data-t="papersTitle"></div>
      <div class="papers-grid" id="papers"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="step" id="s1">
    <div class="stepno">1</div>
    <h2 data-t="s1H"></h2>
    <p class="lead" data-t="s1Lead"></p>
    <div class="panel">
      <div class="controls" id="aChips" role="group"></div>
      <div class="forest" id="c1" role="group"></div>
      <div class="result" aria-live="polite"><div class="big" id="r1big"></div><div class="txt" id="r1txt"></div></div>
      <p class="callout" id="c1note"></p>
      <span class="src" data-t="src1"></span>
    </div>
  </section>

  <section class="step" id="s2">
    <div class="stepno">2</div>
    <h2 data-t="s2H"></h2>
    <p class="lead" data-t="s2Lead"></p>
    <div class="panel">
      <div class="controls" id="modelChips" role="group"></div>
      <div class="chart" id="c2"></div>
      <div class="result" aria-live="polite"><div class="big" id="r2big"></div><div class="txt" id="r2txt"></div></div>
      <p class="callout" id="c2note"></p>
      <div class="why">
        <h3 data-t="whyH"></h3>
        <p data-t="whyP"></p>
        <ul class="bars" id="bars"></ul>
        <p class="eg" data-t="whyEg"></p>
        <p class="overlap" data-t="overlap"></p>
      </div>
      <span class="src" data-t="src2"></span>
    </div>
  </section>

  <section class="step" id="s3">
    <div class="stepno b">3</div>
    <h2 data-t="s3H"></h2>
    <p class="lead" data-t="s3Lead"></p>
    <p class="def" data-t="s3Diff"></p>
    <div class="panel">
      <div class="controls" id="uChips" role="group"></div>
      <div class="chart" id="c3"></div>
      <div class="result blu" aria-live="polite"><div class="big" id="r3big"></div><div class="txt" id="r3txt"></div></div>
      <p class="readout" id="readout"></p>
      <p class="callout blu" id="c3note"></p>
      <span class="src blu" data-t="src3"></span>
    </div>
  </section>

  <section class="step" id="s4">
    <div class="stepno">4</div>
    <h2 data-t="s4H"></h2>
    <p class="lead" data-t="s4Lead"></p>
    <div class="panel">
      <p class="q" id="q1" data-t="q1"></p>
      <div class="opts" id="opts1" role="group" aria-labelledby="q1"></div>
      <p class="q" id="q2" data-t="q2"></p>
      <div class="opts blu" id="opts2" role="group" aria-labelledby="q2"></div>
      <div class="mine" aria-live="polite">
        <div class="result"><div class="eb" data-t="m1eb"></div><div class="main" id="m1"></div><div class="sub" id="m1s"></div></div>
        <div class="result"><div class="eb" data-t="m2eb"></div><div class="main" id="m2"></div><div class="sub" id="m2s"></div></div>
        <div class="result blu"><div class="eb" data-t="m3eb"></div><div class="main" id="m3"></div><div class="sub" id="m3s"></div></div>
      </div>
      <p class="note" data-t="mineNote"></p>
      <div class="next" aria-live="polite"><div class="eb" data-t="nextEb"></div><h3 id="nextH"></h3><p id="nextP"></p></div>
      <div class="links">
        <a href="https://www.swissarmymum.com/p/gut-health-the-metabolic-ally-youre" target="_blank" rel="noopener" data-t="lnkTest"></a>
        <a href="https://www.swissarmymum.com/p/stabilize-blood-sugar-metabolic-health" target="_blank" rel="noopener" data-t="lnkPost"></a>
      </div>
    </div>
  </section>

  <div class="sub-card">
    <div class="sub-title" data-t="subTitle"></div>
    <div class="sub-text" data-t="subText"></div>
    <a class="sub-btn" href="https://www.swissarmymum.com/subscribe?utm_source=lab-fuel&utm_medium=tool&utm_campaign=sam-lab" target="_blank" rel="noopener" data-t="subBtn"></a>
  </div>

  <details class="more">
    <summary data-t="moreSum"></summary>
    <div class="more-body" id="more"></div>
  </details>
</main>
<footer><a href="https://www.swissarmymum.com" target="_blank" rel="noopener">swissarmymum.com</a></footer>

<script>
/* DATA: every number on this page, keyed by data-sheet id (_work/data-sheet.json), copied as printed.

<p><b>Ahmad's result depends on the model.</b> Counting only age, calories and the trial pills the women were given (the study ran inside an aspirin and vitamin E trial), the top group had ${pc(DATA.p1_rrr_upper)} lower risk. Adding smoking, menopause, hormone use, exercise and family history, the top group's plausible range reaches no difference. The "why" factors were each tested on their own and overlap; all of them together in one model accounted for ${pc(dec(DATA.p1_mediator_combined_total))}, as printed, which is less than inflammation alone. The authors say a sizeable part remains unexplained.</p>
<p><b>Who was studied.</b> Ahmad: ${num(DATA.p1_n_analysed)} US female health professionals aged ${DATA.p1_age_eligibility} or older and free of heart disease at the start, average age ${dec(DATA.p1_mean_age)}, with ${pc(dec(DATA.p1_t1_postmenopausal_low))} to ${pc(dec(DATA.p1_t1_postmenopausal_upper))} past menopause depending on diet group. The authors note that health professionals may behave differently from men or higher-risk women. Galbete and Suksatan report no results by sex.</p>
<p><b>Galbete's grades.</b> The authors rate their confidence low or moderate for every outcome, none high. For many of the reviews, the range where a new study's result would likely fall crosses no difference. The review has no "dying from any cause" outcome. Step 1 shows only rows the paper labels as most vs least comparisons; per-2-point rows, rows with an unlabelled comparison and the re-analyses by score type are left out. Moderate alcohol earns a point in the two most used Mediterranean scores, and in Ahmad's; that is not advice to drink.</p>
<p><b>Suksatan's loose ends.</b> The text says ${DATA.p2_allcause_studies_text} studies sit behind the "any cause" figure; the forest plot shows ${DATA.p2_allcause_studies_plot}. The per-${pc(DATA.p2_per_step)} figure carries two different technical labels in the paper (see the table below). The curve by amount is published only as a picture, so this page gives no risk for any specific intake. The text and figure also disagree on whether heart and circulation deaths rise with each extra ${pc(DATA.p2_per_step)}.</p>
<p><b>Two exposures, never one scale.</b> Steps 1 and 2 measure how Mediterranean people ate; step 3 measures how much ultra-processed food they ate. That's why cancer deaths can look lower in one and unchanged in the other without the papers contradicting each other.</p>

<p><b>Relativo frente a absoluto.</b> Porcentajes como «un ${pc(ru.p)} más» comparan grupos. Los ${dec(DATA.p1_events_low_pct)} y ${dec(DATA.p1_events_upper_pct)} de cada 100 son proporciones brutas de mujeres con un primer infarto, ictus o similar, sin ningún ajuste.</p>
<p><b>El resultado de Ahmad depende del modelo.</b> Contando solo la edad, las calorías y las pastillas del ensayo (el estudio se hizo dentro de un ensayo de aspirina y vitamina E), el grupo alto tenía un ${pc(DATA.p1_rrr_upper)} menos de riesgo. Al añadir tabaco, menopausia, terapia hormonal, ejercicio y antecedentes familiares, el margen probable del grupo alto llega a la ausencia de diferencia. Los factores del «por qué» se analizaron uno por uno y se solapan; todos juntos en un mismo modelo se asociaban a un ${pc(dec(DATA.p1_mediator_combined_total))}, tal como se publicó, menos que la inflamación sola. Los autores dicen que una parte considerable queda sin aclarar.</p>
<p><b>A quién se estudió.</b> Ahmad: ${num(DATA.p1_n_analysed)} profesionales sanitarias de EE. UU. de ${DATA.p1_age_eligibility} años o más y sin enfermedad cardiovascular al empezar, con una edad media de ${dec(DATA.p1_mean_age)} años; entre un ${pc(dec(DATA.p1_t1_postmenopausal_low))} y un ${pc(dec(DATA.p1_t1_postmenopausal_upper))} habían pasado la menopausia, según el grupo de dieta. Los autores advierten que las profesionales sanitarias pueden comportarse de forma distinta a los hombres o a mujeres con más riesgo. Galbete y Suksatan no dan resultados por sexo.</p>
<p><b>Las calificaciones de Galbete.</b> Los autores califican su confianza como baja o moderada en todos los resultados; ninguna alta. En muchas de las revisiones, el margen donde caería probablemente el resultado de un estudio nuevo incluye la ausencia de diferencia. La revisión no incluye «morir por cualquier causa». El paso 1 muestra solo las filas que el artículo etiqueta como comparación entre quienes más y menos comen a la mediterránea; se dejan fuera las filas por cada 2 puntos, las de comparación sin etiquetar y los reanálisis por tipo de puntuación. Un consumo moderado de alcohol suma un punto en las dos puntuaciones mediterráneas más usadas, también en la de Ahmad; no es un consejo para beber.</p>
<p><b>Los cabos sueltos de Suksatan.</b> El texto dice que detrás de la cifra de «cualquier causa» hay ${DATA.p2_allcause_studies_text} estudios; el gráfico de bosque muestra ${DATA.p2_allcause_studies_plot}. La cifra por cada ${pc(DATA.p2_per_step)} lleva dos etiquetas técnicas distintas en el artículo (ver la tabla). La curva según la cantidad solo se publicó como imagen, así que esta página no da ningún riesgo para una cantidad concreta. El texto y la figura tampoco coinciden en si las muertes cardiovasculares suben con cada ${pc(DATA.p2_per_step)} más.</p>
<p><b>Dos exposiciones, nunca una sola escala.</b> Los pasos 1 y 2 miden cuánto comía la gente a la mediterránea; el paso 3, cuántos ultraprocesados. Por eso las muertes por cáncer pueden salir más bajas en uno y sin cambios en el otro sin que los artículos se contradigan.</p>
${numbersTable()}
<h3>Fuentes y licencias</h3>
<p>Galbete C, Schwingshackl L, Schwedhelm C, Boeing H, Schulze MB. Evaluating Mediterranean diet and risk of chronic disease in cohort studies: an umbrella review of meta-analyses. <i>European Journal of Epidemiology</i> ${yr("a")}. <a href="https://doi.org/${DATA.papers.a.doi}" target="_blank" rel="noopener">doi:${DATA.papers.a.doi}</a>. Con licencia <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Qué hemos cambiado: hemos seleccionado estimaciones publicadas y las presentamos como gráficos interactivos y texto en lenguaje sencillo; no se ha alterado ningún valor.</p>
<p>Ahmad S, Moorthy MV, Demler OV, Hu FB, Ridker PM, Chasman DI, Mora S. Assessment of Risk Factors and Biomarkers Associated With Risk of Cardiovascular Disease Among Women Consuming a Mediterranean Diet. <i>JAMA Network Open</i> ${yr("p1")}. <a href="https://doi.org/${DATA.papers.p1.doi}" target="_blank" rel="noopener">doi:${DATA.papers.p1.doi}</a>. Con licencia <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Qué hemos cambiado: hemos seleccionado estimaciones publicadas y las presentamos como gráficos interactivos y texto en lenguaje sencillo; no se ha alterado ningún valor.</p>
<p>Suksatan W, Moradi S, Naeini F, Bagheri R, Mohammadi H, Talebi S, Mehrabani S, Hojjati Kermani MA, Suzuki K. Ultra-Processed Food Consumption and Adult Mortality Risk: A Systematic Review and Dose-Response Meta-Analysis of ${DATA.p2_n_participants} Participants. <i>Nutrients</i> ${yr("p2")}. <a href="https://doi.org/${DATA.papers.p2.doi}" target="_blank" rel="noopener">doi:${DATA.papers.p2.doi}</a>. Con licencia <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Qué hemos cambiado: hemos seleccionado estimaciones publicadas y las presentamos como gráficos interactivos y texto en lenguaje sencillo; no se ha alterado ningún valor.</p>
<p>Una explicación independiente, no elaborada ni respaldada por los autores ni por las revistas.</p>
<p>Esto es información educativa, no un consejo médico personal. Tu biología, tu historia y tu contexto importan. Consulta con un profesional sanitario cualificado.</p>`;},

  tP2:"HR, consumo más alto frente a más bajo", tP2per:()=>`Por cada ${pc(DATA.p2_per_step)} más de las calorías diarias`, tP2perN:"OR en el texto, HR en la figura",
  p2Out:{p2_allcause_high_vs_low:"Muerte por cualquier causa",p2_cvd_high_vs_low:"Muerte cardiovascular",p2_heart_high_vs_low:"Muerte por enfermedad cardíaca",p2_cancer_high_vs_low:"Muerte por cáncer"},

}};
const L=()=>T[lang];

const ci=e=>`${dec(e[1])}–${dec(e[2])}`;
function numbersTable(){
  const l=L(),c=l.tblCols;
  let s=`<h3>${l.tblH}</h3><div class="tbl"><table><tr>${c.map(x=>`<th>${x}</th>`).join("")}</tr>`;
  const row=(a,b,m,v,r,n)=>`<tr><td>${a}</td><td>${b}</td><td>${m}</td><td>${v}</td><td>${r}</td><td>${n}</td></tr>`;
  Object.values(A_ROWS).flat().forEach(id=>{const d=DATA[id];s+=row(`Galbete ${yr("a")} (${d.by[0]} ${d.by[1]})`,l.aOut[id],l.tA,dec(d.e[0]),ci(d.e),l.tGrade(d.g))});
  const p1=`Ahmad ${yr("p1")}`,g=l.p1grp;
  [["mid","p1_cvd_middle_vs_low",l.tP1age],["upper","p1_cvd_upper_vs_low",l.tP1age],["mid","p1_cvd_basic_middle_vs_low",l.tP1life],["upper","p1_cvd_basic_upper_vs_low",l.tP1life]]
    .forEach(([k,id,n])=>{const e=DATA[id];s+=row(p1,`${g[k]} (${sc(k)[0]}–${sc(k)[1]})`,l.tP1(),dec(e[0]),ci(e),n)});
  [["low","p1_events_low_pct"],["mid","p1_events_mid_pct"],["upper","p1_events_upper_pct"]].forEach(([k,id])=>{s+=row(p1,`${g[k]} (${sc(k)[0]}–${sc(k)[1]})`,l.tP1ev,dec(DATA[id]),"",l.tP1evN())});
  MEDS.forEach(id=>{s+=row(p1,l.meds[id],l.tP1med,dec(DATA[id]),"",l.tP1medN)});
  s+=row(p1,l.tP1comb,l.tP1med,dec(DATA.p1_mediator_combined_total),"",l.tP1combN);

  ["p2_allcause_high_vs_low","p2_cvd_high_vs_low","p2_heart_high_vs_low","p2_cancer_high_vs_low"].forEach(id=>{const e=DATA[id];s+=row(p2,l.p2Out[id],l.tP2,dec(e[0]),ci(e),"")});
  s+=row(p2,l.p2Out.p2_allcause_high_vs_low,l.tP2per(),dec(DATA.p2_allcause_per10pct[0]),ci(DATA.p2_allcause_per10pct),l.tP2perN);

const narrow=()=>innerWidth<600;
/* x position for a printed ratio on a scale given in hundredths, clamped to the plot area */
const sx=(scl,x0,x1)=>v=>Math.max(x0,Math.min(x1,x0+(hund(v)-scl[0])/(scl[1]-scl[0])*(x1-x0)));
/* filled circle = Mediterranean ("add"); hollow ring = ultra-processed ("cut") */
function mark(cx,cy,r,kind,on){
  return kind==="add"?`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${on?"#025A5A":"#3D7A78"}" stroke="#fff" stroke-width="2"/>`
    :`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${on?"#00579B":"#3A78B0"}" stroke-width="${on?3.5:2.5}"/>`;
}
function whisker(e,X,cy,kind,on){
  const c=kind==="add"?(on?"#025A5A":"#3D7A78"):(on?"#00579B":"#3A78B0"),lo=X(e[1]),hi=X(e[2]),w=on?4:3;
  return `<line x1="${lo}" x2="${hi}" y1="${cy}" y2="${cy}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`+
    `<line x1="${lo}" x2="${lo}" y1="${cy-6}" y2="${cy+6}" stroke="${c}" stroke-width="2"/><line x1="${hi}" x2="${hi}" y1="${cy-6}" y2="${cy+6}" stroke="${c}" stroke-width="2"/>`+
    mark(X(e[0]),cy,on?8:6,kind,on);
}
/* Step 1: one button per published Galbete row, each with its own dot-and-whisker track on a shared scale */
function chart1(){
  const l=L(),ids=A_ROWS[st.a],nw=narrow(),box=$("c1"),cw=box.clientWidth||700;
  /* track drawn at its real pixel width so labels keep their size */
  const W=Math.max(200,Math.round(nw?cw-20:cw-20-220-116-24)),H=30,P=10,X=sx(SC_A,P,W-P),xr=X("1.00");box.setAttribute("aria-label",l.aGroup);
  let s=`<div class="faxis" aria-hidden="true"><span class="fl"></span><svg class="ft" viewBox="0 0 ${W} 16"><text x="${xr}" y="12" text-anchor="middle" font-size="11" font-weight="700" fill="#4A4A45">${l.noDiff}</text></svg><span class="fv"></span></div>`;
  ids.forEach((id,i)=>{
    const d=DATA[id],r=ph(d.e),on=i===st.aRow[st.a];
    s+=`<button type="button" class="frow" data-row="${i}" aria-pressed="${on}"><span class="fl"><b>${l.aOut[id]}</b><span>${d.by[0]} ${d.by[1]} · ${l.grade[d.g]}</span></span>`+
      `<svg class="ft" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">${whisker(d.e,X,H/2,"add",on)}</svg>`+
      `<span class="fv">${l.vl(r)}</span></button>`;
  });
  s+=`<div class="faxis" aria-hidden="true"><span class="fl"></span><svg class="ft" viewBox="0 0 ${W} 16"><text x="${P}" y="12" font-size="11" fill="#4A4A45">← ${l.lessD}</text><text x="${W-P}" y="12" text-anchor="end" font-size="11" fill="#4A4A45">${l.moreD} →</text></svg><span class="fv"></span></div>`;
  box.innerHTML=s;
  const f=box.querySelector(".frow .ft"),rows=box.querySelectorAll(".frow");
  if(f&&rows.length){const bb=box.getBoundingClientRect(),fb=f.getBoundingClientRect(),x=fb.left-bb.left+xr*fb.width/W;
    const y0=rows[0].getBoundingClientRect().top-bb.top,y1=rows[rows.length-1].getBoundingClientRect().bottom-bb.top;
    box.insertAdjacentHTML("beforeend",`<div class="refline" aria-hidden="true" style="left:${x-0.75}px;top:${y0}px;height:${y1-y0}px"></div>`);}
}
/* Steps 2 and 3: one labelled SVG, rows = published estimates, whiskers = plausible range, no connecting lines */
function forest(rows,scl,kind,aria){
  const l=L(),nw=narrow(),W=nw?360:760,lab=nw?0:250,valW=nw?0:150,rowH=nw?58:48,top=24,H=top+rows.length*rowH+26;
  const x0=nw?14:lab+14,x1=nw?W-14:W-valW-14,X=sx(scl,x0,x1),xr=X("1.00"),col=kind==="add"?"#025A5A":"#00579B";
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}"><style>text{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}</style>`;
  s+=`<line x1="${xr}" x2="${xr}" y1="${top-4}" y2="${H-24}" stroke="#8A8A82" stroke-width="1.5"/>`;
  s+=`<text x="${xr}" y="${top-10}" text-anchor="middle" font-size="11" font-weight="700" fill="#4A4A45">${l.noDiff}</text>`;
  rows.forEach((r,i)=>{
    const y=top+i*rowH,cy=nw?y+40:y+rowH/2,fw=r.on?800:600,fc=r.on?"#1A1A18":"#4A4A45";
    if(nw){
      s+=`<text x="0" y="${y+16}" font-size="12.5" font-weight="${fw}" fill="${fc}">${r.label}${r.sub&&r.e?` · ${r.sub}`:""}</text>`;
      s+=`<text x="${W}" y="${y+16}" text-anchor="end" font-size="12.5" font-weight="800" fill="${r.e?col:"#4A4A45"}">${r.val}</text>`;
    }else{
      s+=`<text x="0" y="${cy-2}" font-size="13.5" font-weight="${fw}" fill="${fc}">${r.label}</text>`;
      if(r.sub) s+=`<text x="0" y="${cy+14}" font-size="11.5" fill="#4A4A45">${r.sub}</text>`;
      s+=`<text x="${W}" y="${cy+5}" text-anchor="end" font-size="13.5" font-weight="${r.on?800:700}" fill="${r.e?col:"#4A4A45"}">${r.val}</text>`;
    }
    if(r.e) s+=whisker(r.e,X,cy,kind,r.on);
    else s+=`<rect x="${xr-6}" y="${cy-6}" width="12" height="12" transform="rotate(45 ${xr} ${cy})" fill="#fff" stroke="#4A4A45" stroke-width="2"/>`;
  });
  s+=`<text x="${x0}" y="${H-6}" font-size="11" fill="#4A4A45">← ${l.lower}</text><text x="${x1}" y="${H-6}" text-anchor="end" font-size="11" fill="#4A4A45">${l.higher} →</text></svg>`;
  return s;
}
const P1KEY={life:{mid:"p1_cvd_basic_middle_vs_low",upper:"p1_cvd_basic_upper_vs_low"},age:{mid:"p1_cvd_middle_vs_low",upper:"p1_cvd_upper_vs_low"}};

const chips=(arr,key,cur,cls="")=>arr.map(([k,n])=>`<button type="button" class="chip ${cls}" data-${key}="${k}" aria-pressed="${cur===k}">${n}</button>`).join("");
